name: Monster Choice RPG REWORK-007 Godot Verification

on:
  push:
    branches:
      - monster-choice-v0025-apk-build
    paths:
      - ".github/workflows/monster-choice-rework002b-godot-verify.yml"

permissions:
  contents: read

concurrency:
  group: monster-choice-rework007-godot-verify
  cancel-in-progress: true

env:
  PROJECT_PATH: monster_choice_rpg_rework007
  SOURCE_SHA256: fe4a98247ddc6a3af3a9f4f9473248b1c9734ab9f557abe8f1e3473ea4b929cb
  SOURCE_URL: "https://sdmntpreastus2.oaiusercontent.com/files/00000000-ef3c-81f6-89d4-645a7b230091/raw?se=2026-09-17T05%3A15%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=fd51cbd8-f6c1-5bd7-b7bd-da6f1e70b484&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T02%3A53%3A39Z&ske=2026-09-18T02%3A53%3A39Z&sks=b&skv=2026-02-06&sig=rTIweCjc1wFhSivOJJ%2B9xjQQK0kIV%2Bir6AlRD0kusME%3D"

jobs:
  verify-rework007:
    name: Verify REWORK-007 exact source under Godot 4.7.2
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout temporary verification branch
        uses: actions/checkout@v4

      - name: Fetch exact Drive candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_PATH" build-evidence
          curl --fail --location --retry 3 --retry-delay 2 "$SOURCE_URL" -o source-rework007.zip
          echo "$SOURCE_SHA256  source-rework007.zip" | sha256sum -c - | tee build-evidence/source-sha256.txt
          unzip -q source-rework007.zip -d "$PROJECT_PATH"
          test -f "$PROJECT_PATH/project.godot"
          test -f "$PROJECT_PATH/MANIFEST.sha256"
          test -f "$PROJECT_PATH/scenes/rework/stoneveil_exploration.tscn"
          test -f "$PROJECT_PATH/src/ui/rework/stoneveil_visual_foundation.gd"
          test -f "$PROJECT_PATH/src/ui/rework/stoneveil_visual_convergence.gd"
          test -f "$PROJECT_PATH/tests/rework_visual_convergence_smoke.gd"
          test -f "$PROJECT_PATH/tools/verify_rework_visual_convergence.py"
          (
            cd "$PROJECT_PATH"
            sha256sum -c MANIFEST.sha256
            python3 tools/verify_rework_authority.py
            python3 tools/verify_rework_visual_foundation.py
            python3 tools/verify_rework_embodied_world.py
            python3 tools/verify_rework_visual_convergence.py
          ) > build-evidence/source-static-check.log

      - name: Set up Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
          cache: false

      - name: Record engine identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "source_sha256=${SOURCE_SHA256}"
            godot --version
          } | tee build-evidence/identity.txt

      - name: Godot import and parse gate
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --verbose --editor --path "$PROJECT_PATH" --quit 2>&1 | tee build-evidence/godot-import-parse.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|ERROR:.*(parse|load|resource)" build-evidence/godot-import-parse.log; then
            echo "Blocking Godot import/parse error detected."
            exit 1
          fi

      - name: Run existing core Godot suite
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/run_tests.gd 2>&1 | tee build-evidence/godot-core-tests.log
          grep -q "PASS: 20/20 core prototype test groups" build-evidence/godot-core-tests.log

      - name: Run REWORK-002 encounter smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/rework_scene_smoke.gd 2>&1 | tee build-evidence/rework002-scene-smoke.log
          grep -q "PASS: REWORK-002 Godot scene smoke" build-evidence/rework002-scene-smoke.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found" build-evidence/rework002-scene-smoke.log; then exit 1; fi

      - name: Run REWORK-003 exploration smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/rework_exploration_smoke.gd 2>&1 | tee build-evidence/rework003-exploration-smoke.log
          grep -q "PASS: REWORK-003 exploration-to-hunt Godot smoke" build-evidence/rework003-exploration-smoke.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found" build-evidence/rework003-exploration-smoke.log; then exit 1; fi

      - name: Run REWORK-004 return persistence smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/rework_return_persistence_smoke.gd 2>&1 | tee build-evidence/rework004-return-persistence-smoke.log
          grep -q "PASS: REWORK-004 return/persistence Godot smoke" build-evidence/rework004-return-persistence-smoke.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found" build-evidence/rework004-return-persistence-smoke.log; then exit 1; fi

      - name: Run REWORK-005 visual foundation smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/rework_visual_foundation_smoke.gd 2>&1 | tee build-evidence/rework005-visual-smoke.log
          grep -q "PASS: REWORK-005 visual foundation Godot smoke" build-evidence/rework005-visual-smoke.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found" build-evidence/rework005-visual-smoke.log; then exit 1; fi

      - name: Run REWORK-006 embodied world smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/rework_embodied_world_smoke.gd 2>&1 | tee build-evidence/rework006-embodied-world-smoke.log
          grep -q "PASS: REWORK-006 embodied world Godot smoke" build-evidence/rework006-embodied-world-smoke.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found" build-evidence/rework006-embodied-world-smoke.log; then exit 1; fi

      - name: Run REWORK-007 visual convergence smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/rework_visual_convergence_smoke.gd 2>&1 | tee build-evidence/rework007-visual-convergence-smoke.log
          grep -q "PASS: REWORK-007 visual convergence Godot smoke" build-evidence/rework007-visual-convergence-smoke.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found" build-evidence/rework007-visual-convergence-smoke.log; then exit 1; fi

      - name: Boot promoted Stoneveil scene directly
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$PROJECT_PATH"
            timeout 30s godot --headless --path . res://scenes/rework/stoneveil_exploration.tscn --quit-after 8
          ) 2>&1 | tee build-evidence/rework007-field-boot.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found|ERROR:.*(parse|load|resource)" build-evidence/rework007-field-boot.log; then
            echo "Blocking REWORK-007 runtime error detected."
            exit 1
          fi

      - name: Upload short-lived verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monster-choice-rework007-repaired-evidence
          path: build-evidence/
          if-no-files-found: error
          retention-days: 1
