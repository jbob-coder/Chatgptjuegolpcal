name: Monster Choice RPG PIXEL-006 Godot Verification

on:
  push:
    branches:
      - monster-choice-v0025-apk-build
    paths:
      - ".github/workflows/monster-choice-rework002b-godot-verify.yml"

permissions:
  contents: read

concurrency:
  group: monster-choice-pixel006-godot-verify
  cancel-in-progress: true

env:
  PROJECT_PATH: monster_choice_rpg_pixel006
  SOURCE_SHA256: e541c3a3a7a654c2c959733a5724be1c6f33f8f5c6775637e1b16f195bde3e35
  SOURCE_URL: "https://sdmntpreastus2.oaiusercontent.com/files/00000000-b1fc-81f6-b5fd-d4cb62b19a4f/raw?se=2026-09-17T23%3A47%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=6abb4574-8525-570d-9a64-0c9d3d74277c&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T12%3A38%3A11Z&ske=2026-09-18T12%3A38%3A11Z&sks=b&skv=2026-02-06&sig=S1yrc9meQ6puOOAHWzWQFFxu4GXCGXVe1PsbPJ6aiSA%3D"

jobs:
  verify-pixel006:
    name: Verify PIXEL-006 exact source under Godot 4.7.2
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout temporary verification branch
        uses: actions/checkout@v4

      - name: Prepare verifier Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .verify-venv
          .verify-venv/bin/pip install --disable-pip-version-check pillow

      - name: Fetch exact Drive candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_PATH" build-evidence
          curl --fail --location --retry 3 --retry-delay 2 "$SOURCE_URL" -o source-pixel006.zip
          echo "$SOURCE_SHA256  source-pixel006.zip" | sha256sum -c - | tee build-evidence/source-sha256.txt
          unzip -q source-pixel006.zip -d "$PROJECT_PATH"
          test -f "$PROJECT_PATH/project.godot"
          test -f "$PROJECT_PATH/MANIFEST.sha256"
          test -f "$PROJECT_PATH/scenes/pixel/pixel_scale_lab.tscn"
          test -f "$PROJECT_PATH/tests/pixel_scale_lab_smoke.gd"
          test -f "$PROJECT_PATH/scenes/pixel/pixel_hunter_animation_lab.tscn"
          test -f "$PROJECT_PATH/tests/pixel_hunter_animation_lab_smoke.gd"
          test -f "$PROJECT_PATH/scenes/pixel/pixel_stoneveil_tileset_lab.tscn"
          test -f "$PROJECT_PATH/tests/pixel_stoneveil_tileset_lab_smoke.gd"
          test -f "$PROJECT_PATH/scenes/pixel/pixel_ashhorn_animation_lab.tscn"
          test -f "$PROJECT_PATH/src/ui/pixel/pixel_ashhorn_animation_lab.gd"
          test -f "$PROJECT_PATH/tests/pixel_ashhorn_animation_lab_smoke.gd"
          test -f "$PROJECT_PATH/tools/verify_pixel_ashhorn_candidate.py"
          test -f "$PROJECT_PATH/assets/pixel_v2/production/ashhorn_01_candidate.png"
          test -f "$PROJECT_PATH/assets/pixel_v2/production/ashhorn_01_candidate.json"
          test -f "$PROJECT_PATH/scenes/pixel/pixel_vertical_slice_lab.tscn"
          test -f "$PROJECT_PATH/src/ui/pixel/pixel_vertical_slice_lab.gd"
          test -f "$PROJECT_PATH/tests/pixel_vertical_slice_lab_smoke.gd"
          test -f "$PROJECT_PATH/tools/verify_pixel_vertical_slice_lab.py"
          (
            cd "$PROJECT_PATH"
            sha256sum -c MANIFEST.sha256
            python3 tools/verify_structure.py
            python3 tools/verify_android_config.py
            python3 tools/verify_pixel_direction.py
            "$GITHUB_WORKSPACE/.verify-venv/bin/python" tools/verify_pixel_scale_lab.py
            "$GITHUB_WORKSPACE/.verify-venv/bin/python" tools/verify_pixel_hunter_candidate.py
            "$GITHUB_WORKSPACE/.verify-venv/bin/python" tools/verify_pixel_ground_candidate.py
            "$GITHUB_WORKSPACE/.verify-venv/bin/python" tools/verify_pixel_water_cliff_candidate.py
            "$GITHUB_WORKSPACE/.verify-venv/bin/python" tools/verify_pixel_ashhorn_candidate.py
            "$GITHUB_WORKSPACE/.verify-venv/bin/python" tools/verify_pixel_vertical_slice_lab.py
            python3 tools/verify_rework_authority.py
            python3 tools/verify_rework_lifecycle_persistence.py
          ) > build-evidence/source-static-check.log

      - name: Set up Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
          cache: false

      - name: Record engine identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "source_sha256=${SOURCE_SHA256}"
            godot --version
          } | tee build-evidence/identity.txt

      - name: Godot import and parse gate
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --verbose --editor --path "$PROJECT_PATH" --quit 2>&1 | tee build-evidence/godot-import-parse.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|ERROR:.*(parse|load|resource)" build-evidence/godot-import-parse.log; then
            echo "Blocking Godot import/parse error detected."
            exit 1
          fi

      - name: Run existing core Godot suite
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/run_tests.gd 2>&1 | tee build-evidence/godot-core-tests.log
          grep -q "PASS: 20/20 core prototype test groups" build-evidence/godot-core-tests.log

      - name: Run REWORK-008 lifecycle persistence regression smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/rework_lifecycle_persistence_smoke.gd 2>&1 | tee build-evidence/rework008-lifecycle-persistence-smoke.log
          grep -q "PASS: REWORK-008 unified lifecycle persistence Godot smoke" build-evidence/rework008-lifecycle-persistence-smoke.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found" build-evidence/rework008-lifecycle-persistence-smoke.log; then exit 1; fi

      - name: Run PIXEL-002 scale laboratory regression smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/pixel_scale_lab_smoke.gd 2>&1 | tee build-evidence/pixel002-scale-lab-smoke.log
          grep -q "PASS: PIXEL-002 scale laboratory Godot smoke" build-evidence/pixel002-scale-lab-smoke.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found" build-evidence/pixel002-scale-lab-smoke.log; then exit 1; fi

      - name: Run PIXEL-003 hunter regression smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/pixel_hunter_animation_lab_smoke.gd 2>&1 | tee build-evidence/pixel003-hunter-smoke.log
          grep -q "PASS: PIXEL-003 hunter animation laboratory Godot smoke" build-evidence/pixel003-hunter-smoke.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found" build-evidence/pixel003-hunter-smoke.log; then exit 1; fi

      - name: Run PIXEL-004B Stoneveil terrain regression smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/pixel_stoneveil_tileset_lab_smoke.gd 2>&1 | tee build-evidence/pixel004b-stoneveil-terrain-smoke.log
          grep -q "PASS: PIXEL-004B Stoneveil water/cliff tileset laboratory Godot smoke" build-evidence/pixel004b-stoneveil-terrain-smoke.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found" build-evidence/pixel004b-stoneveil-terrain-smoke.log; then exit 1; fi

      - name: Run PIXEL-005B Ashhorn tail-readability smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/pixel_ashhorn_animation_lab_smoke.gd 2>&1 | tee build-evidence/pixel005b-ashhorn-smoke.log
          grep -q "PASS: PIXEL-005B Ashhorn tail-readability laboratory Godot smoke" build-evidence/pixel005b-ashhorn-smoke.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found" build-evidence/pixel005b-ashhorn-smoke.log; then exit 1; fi

      - name: Boot PIXEL-005B Ashhorn scene directly
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$PROJECT_PATH"
            timeout 30s godot --headless --path . res://scenes/pixel/pixel_ashhorn_animation_lab.tscn --quit-after 8
          ) 2>&1 | tee build-evidence/pixel005b-ashhorn-boot.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found|ERROR:.*(parse|load|resource)" build-evidence/pixel005b-ashhorn-boot.log; then
            echo "Blocking PIXEL-005B runtime error detected."
            exit 1
          fi

      - name: Run PIXEL-006 vertical-slice integration smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/pixel_vertical_slice_lab_smoke.gd 2>&1 | tee build-evidence/pixel006-integration-smoke.log
          grep -q "PASS: PIXEL-006 pixel vertical-slice integration laboratory Godot smoke" build-evidence/pixel006-integration-smoke.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found" build-evidence/pixel006-integration-smoke.log; then exit 1; fi

      - name: Boot PIXEL-006 integration scene directly
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$PROJECT_PATH"
            timeout 30s godot --headless --path . res://scenes/pixel/pixel_vertical_slice_lab.tscn --quit-after 8
          ) 2>&1 | tee build-evidence/pixel006-integration-boot.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found|ERROR:.*(parse|load|resource)" build-evidence/pixel006-integration-boot.log; then
            echo "Blocking PIXEL-006 runtime error detected."
            exit 1
          fi

      - name: Upload short-lived verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monster-choice-pixel006-evidence
          path: build-evidence/
          if-no-files-found: error
          retention-days: 1
