name: Monster Choice RPG PIXEL-002 Godot Verification

on:
  push:
    branches:
      - monster-choice-v0025-apk-build
    paths:
      - ".github/workflows/monster-choice-rework002b-godot-verify.yml"

permissions:
  contents: read

concurrency:
  group: monster-choice-pixel002-godot-verify
  cancel-in-progress: true

env:
  PROJECT_PATH: monster_choice_rpg_pixel002
  SOURCE_SHA256: e6c6481b816ea7b7b5a86617b0b0b06c28ab002958d962e195ff5eeb4f46fe3b
  SOURCE_URL: "https://sdmntpreastus2.oaiusercontent.com/files/00000000-9c60-81f6-acc4-60359e5a11af/raw?se=2026-09-17T19%3A57%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=bd0d48dc-f37b-5116-866c-19f3655a05fb&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T02%3A38%3A51Z&ske=2026-09-18T02%3A38%3A51Z&sks=b&skv=2026-02-06&sig=u7yosKng9jbnoduEdH5ZwPNGy5GrsfqxqniAQui%2BLxE%3D"

jobs:
  verify-pixel002:
    name: Verify PIXEL-002 exact source under Godot 4.7.2
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout temporary verification branch
        uses: actions/checkout@v4

      - name: Prepare verifier Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .verify-venv
          .verify-venv/bin/pip install --disable-pip-version-check pillow

      - name: Fetch exact Drive candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_PATH" build-evidence
          curl --fail --location --retry 3 --retry-delay 2 "$SOURCE_URL" -o source-pixel002.zip
          echo "$SOURCE_SHA256  source-pixel002.zip" | sha256sum -c - | tee build-evidence/source-sha256.txt
          unzip -q source-pixel002.zip -d "$PROJECT_PATH"
          test -f "$PROJECT_PATH/project.godot"
          test -f "$PROJECT_PATH/MANIFEST.sha256"
          test -f "$PROJECT_PATH/scenes/pixel/pixel_scale_lab.tscn"
          test -f "$PROJECT_PATH/src/ui/pixel/pixel_scale_lab.gd"
          test -f "$PROJECT_PATH/tests/pixel_scale_lab_smoke.gd"
          test -f "$PROJECT_PATH/tools/verify_pixel_scale_lab.py"
          test -f "$PROJECT_PATH/assets/pixel_v2/lab/hunter_idle_probe.png"
          test -f "$PROJECT_PATH/assets/pixel_v2/lab/ashhorn_idle_probe.png"
          (
            cd "$PROJECT_PATH"
            sha256sum -c MANIFEST.sha256
            python3 tools/verify_structure.py
            python3 tools/verify_android_config.py
            python3 tools/verify_pixel_direction.py
            "$GITHUB_WORKSPACE/.verify-venv/bin/python" tools/verify_pixel_scale_lab.py
            python3 tools/verify_rework_authority.py
            python3 tools/verify_rework_lifecycle_persistence.py
          ) > build-evidence/source-static-check.log

      - name: Set up Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
          cache: false

      - name: Record engine identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "source_sha256=${SOURCE_SHA256}"
            godot --version
          } | tee build-evidence/identity.txt

      - name: Godot import and parse gate
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --verbose --editor --path "$PROJECT_PATH" --quit 2>&1 | tee build-evidence/godot-import-parse.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|ERROR:.*(parse|load|resource)" build-evidence/godot-import-parse.log; then
            echo "Blocking Godot import/parse error detected."
            exit 1
          fi

      - name: Run existing core Godot suite
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/run_tests.gd 2>&1 | tee build-evidence/godot-core-tests.log
          grep -q "PASS: 20/20 core prototype test groups" build-evidence/godot-core-tests.log

      - name: Run REWORK-008 lifecycle persistence regression smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/rework_lifecycle_persistence_smoke.gd 2>&1 | tee build-evidence/rework008-lifecycle-persistence-smoke.log
          grep -q "PASS: REWORK-008 unified lifecycle persistence Godot smoke" build-evidence/rework008-lifecycle-persistence-smoke.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found" build-evidence/rework008-lifecycle-persistence-smoke.log; then exit 1; fi

      - name: Run PIXEL-002 scale laboratory smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/pixel_scale_lab_smoke.gd 2>&1 | tee build-evidence/pixel002-scale-lab-smoke.log
          grep -q "PASS: PIXEL-002 scale laboratory Godot smoke" build-evidence/pixel002-scale-lab-smoke.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found" build-evidence/pixel002-scale-lab-smoke.log; then exit 1; fi

      - name: Boot pixel scale laboratory scene directly
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$PROJECT_PATH"
            timeout 30s godot --headless --path . res://scenes/pixel/pixel_scale_lab.tscn --quit-after 8
          ) 2>&1 | tee build-evidence/pixel002-scale-lab-boot.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found|ERROR:.*(parse|load|resource)" build-evidence/pixel002-scale-lab-boot.log; then
            echo "Blocking PIXEL-002 runtime error detected."
            exit 1
          fi

      - name: Upload short-lived verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monster-choice-pixel002-final-evidence
          path: build-evidence/
          if-no-files-found: error
          retention-days: 1
