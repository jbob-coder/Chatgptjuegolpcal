name: Monster Choice RPG REWORK-004 Godot Verification

on:
  push:
    branches:
      - monster-choice-v0025-apk-build
    paths:
      - ".github/workflows/monster-choice-rework002b-godot-verify.yml"

permissions:
  contents: read

concurrency:
  group: monster-choice-rework004-godot-verify
  cancel-in-progress: true

env:
  PROJECT_PATH: monster_choice_rpg_rework004
  SOURCE_SHA256: 2db1f5252cf0746c717f6bb529335700c824cb2e5945583ea84d3143be82bf88
  SOURCE_URL: "https://sdmntpreastus2.oaiusercontent.com/files/00000000-0b80-81f6-b747-01158f966381/raw?se=2026-09-17T02%3A24%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=624b4494-7790-5deb-abc5-c9b204efcf82&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T18%3A38%3A53Z&ske=2026-09-17T18%3A38%3A53Z&sks=b&skv=2026-02-06&sig=SGPTQlraoGffyiZKpnHaWvax%2BL6EhDnsjC8tC3sTDEQ%3D"

jobs:
  verify-rework004:
    name: Verify REWORK-004 exact source under Godot 4.7.2
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout temporary verification branch
        uses: actions/checkout@v4

      - name: Fetch exact Drive candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_PATH" build-evidence
          curl --fail --location --retry 3 --retry-delay 2 "$SOURCE_URL" -o source-rework004.zip
          echo "$SOURCE_SHA256  source-rework004.zip" | sha256sum -c - | tee build-evidence/source-sha256.txt
          unzip -q source-rework004.zip -d "$PROJECT_PATH"
          test -f "$PROJECT_PATH/project.godot"
          test -f "$PROJECT_PATH/MANIFEST.sha256"
          test -f "$PROJECT_PATH/scenes/rework/immersive_hunt.tscn"
          test -f "$PROJECT_PATH/scenes/rework/stoneveil_exploration.tscn"
          test -f "$PROJECT_PATH/src/world/campaign_state.gd"
          test -f "$PROJECT_PATH/src/world/settlement_catalog.gd"
          test -f "$PROJECT_PATH/src/persistence/campaign_save_service.gd"
          test -f "$PROJECT_PATH/tests/rework_scene_smoke.gd"
          test -f "$PROJECT_PATH/tests/rework_exploration_smoke.gd"
          test -f "$PROJECT_PATH/tests/rework_return_persistence_smoke.gd"
          (
            cd "$PROJECT_PATH"
            sha256sum -c MANIFEST.sha256
          ) > build-evidence/manifest-check.log

      - name: Set up Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
          cache: false

      - name: Record engine identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "source_sha256=${SOURCE_SHA256}"
            godot --version
          } | tee build-evidence/identity.txt

      - name: Godot import and parse gate
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --verbose --editor --path "$PROJECT_PATH" --quit 2>&1 | tee build-evidence/godot-import-parse.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|ERROR:.*(parse|load|resource)" build-evidence/godot-import-parse.log; then
            echo "Blocking Godot import/parse error detected."
            exit 1
          fi

      - name: Run existing core Godot suite
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/run_tests.gd 2>&1 | tee build-evidence/godot-core-tests.log
          grep -q "PASS: 20/20 core prototype test groups" build-evidence/godot-core-tests.log

      - name: Run REWORK-002 encounter smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/rework_scene_smoke.gd 2>&1 | tee build-evidence/rework002-scene-smoke.log
          grep -q "PASS: REWORK-002 Godot scene smoke" build-evidence/rework002-scene-smoke.log

      - name: Run REWORK-003 exploration smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/rework_exploration_smoke.gd 2>&1 | tee build-evidence/rework003-exploration-smoke.log
          grep -q "PASS: REWORK-003 exploration-to-hunt Godot smoke" build-evidence/rework003-exploration-smoke.log

      - name: Run REWORK-004 return persistence smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/rework_return_persistence_smoke.gd 2>&1 | tee build-evidence/rework004-return-persistence-smoke.log
          grep -q "PASS: REWORK-004 return/persistence Godot smoke" build-evidence/rework004-return-persistence-smoke.log

      - name: Boot REWORK-004 field scene directly
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$PROJECT_PATH"
            timeout 30s godot --headless --path . res://scenes/rework/stoneveil_exploration.tscn --quit-after 8
          ) 2>&1 | tee build-evidence/rework004-field-boot.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found|ERROR:.*(parse|load|resource)" build-evidence/rework004-field-boot.log; then
            echo "Blocking REWORK-004 runtime error detected."
            exit 1
          fi

      - name: Upload short-lived verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monster-choice-rework004-evidence
          path: build-evidence/
          if-no-files-found: error
          retention-days: 1
