name: Shooter RPG Runtime Gate

on:
  push:
    branches:
      - shooter-rpg
      - shooter-rpg-mobile-touch-input-001
    paths:
      - 'shooter_game/**'
      - '.github/workflows/shooter-rpg-graybox-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shooter-rpg-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static preflights
        run: |
          python shooter_game/tests/scaffold_static_preflight.py
          python shooter_game/tests/player_camera_static_preflight.py
          python shooter_game/tests/mobile_touch_static_preflight.py

      - name: Download Godot 4.7.2 stable
        shell: bash
        run: |
          set -euo pipefail
          GODOT_ZIP='Godot_v4.7.2-stable_linux.x86_64.zip'
          GODOT_URL='https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          EXPECTED_SHA256='cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4'
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output "$RUNNER_TEMP/$GODOT_ZIP"
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/$GODOT_ZIP" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/$GODOT_ZIP" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Verify Godot version
        run: |
          "$GODOT_BIN" --version

      - name: Import and parse Shooter RPG project
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path shooter_game --quit-after 2

      - name: Scaffold headless smoke
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path shooter_game --script res://tests/scaffold_smoke.gd

      - name: Player camera and movement headless smoke
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path shooter_game --script res://tests/player_camera_smoke.gd

      - name: Mobile touch headless smoke
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path shooter_game --script res://tests/mobile_touch_smoke.gd

      - name: Runtime gate summary
        if: always()
        run: |
          {
            echo '## Shooter RPG Runtime Gate'
            echo ''
            echo '- Engine target: Godot 4.7.2-stable'
            echo '- Project: shooter_game/'
            echo '- Perspective: first-person'
            echo '- Target horizontal FOV: 115 degrees'
            echo '- Movement: ground jump + wall jump'
            echo '- Mobile input: left movement + right look + semantic action buttons'
            echo '- This workflow does not prove real-phone ergonomics, visual quality, frame pacing, or Android export.'
          } >> "$GITHUB_STEP_SUMMARY"
