name: WorldLife v0.4 Verified Build Only

on:
  push:
    branches: [worldlife-apk-build]
    paths:
      - 'worldlife_patch_v040_text/**'
      - '.github/workflows/worldlife-v040-buildonly.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reconstruct verified base and landscape patch
        shell: bash
        run: |
          set -euo pipefail
          cat worldlife_build_v2/source.v2.part* > /tmp/worldlife_v2.b64
          echo "9602d56236f4d74ea7fceb63f8a9e00051cc7f812d67818258223191a44be31b  /tmp/worldlife_v2.b64" | sha256sum -c -
          base64 -d /tmp/worldlife_v2.b64 > /tmp/worldlife_base.zip
          echo "58686f5de9bcf4151b071792c618d6b3388bf6abe4a8aea11daa0563b5a0b03e  /tmp/worldlife_base.zip" | sha256sum -c -
          mkdir -p /tmp/worldlife-v040
          unzip -q /tmp/worldlife_base.zip -d /tmp/worldlife-v040
          ROOT=/tmp/worldlife-v040/worldlife-rpg-android
          cp -a worldlife_patch_v021/app/. "$ROOT/app/"
          test -s "$ROOT/app/dev-signing.jks"

          echo "b3f5aab5731cf55d8b3b741ee92ff4875662a60e539051865bba2ffd1f69bb94  worldlife_patch_v040_text/patch.part000" | sha256sum -c -
          echo "e25cbc4d2946bc6c5c33a2f70d632e3376670e6c186c97c0988be1c447df0945  worldlife_patch_v040_text/patch.part001a" | sha256sum -c -
          echo "39c113cbaf7d4f035808672dca6ef7e8d07f1c1a6923950cb51452fdb26c9f0d  worldlife_patch_v040_text/patch.part001b" | sha256sum -c -
          echo "7b2d9eb7abaab395e381bdd15eefb0500424725bca979bd267b7c6d2f903550d  worldlife_patch_v040_text/patch.part002" | sha256sum -c -
          echo "da482e3644ae5d3e83fca2efa81540de019f866f82993c366a526ff8cdc640d3  worldlife_patch_v040_text/patch.part003" | sha256sum -c -
          echo "1ee7756873d057145ca55f9900ffcb5373b745591d0b3d94bf893e5858c91464  worldlife_patch_v040_text/patch.part004" | sha256sum -c -
          cat worldlife_patch_v040_text/patch.part* > /tmp/worldlife_v040.b64
          echo "92d324f40dc01ea6a8800a5f4f85ede7151b8ef5f66df3ffb8eac5bda1cd7a2a  /tmp/worldlife_v040.b64" | sha256sum -c -
          base64 -d /tmp/worldlife_v040.b64 > /tmp/worldlife_v040.zip
          echo "f728ae8ff3b60d9af5d253617b5d4cde213c178b11549b86f1c3b1452130a653  /tmp/worldlife_v040.zip" | sha256sum -c -
          unzip -qo /tmp/worldlife_v040.zip -d "$ROOT"
          sed -E -i 's/const val MINUTES_PER_STEP = [0-9]+/const val MINUTES_PER_STEP = 1/' "$ROOT/game-core/src/main/kotlin/com/jackwilson/worldlife/core/OpenWorldCatalog.kt"
          grep -F 'versionCode = 5' "$ROOT/app/build.gradle.kts"
          grep -F 'versionName = "0.4.0"' "$ROOT/app/build.gradle.kts"
          grep -F 'android:screenOrientation="landscape"' "$ROOT/app/src/main/AndroidManifest.xml"
          grep -F 'VirtualJoystick(' "$ROOT/app/src/main/java/com/jackwilson/worldlife/ui/OpenWorldScreen.kt"
          grep -F 'ShooterActionCluster(' "$ROOT/app/src/main/java/com/jackwilson/worldlife/ui/OpenWorldScreen.kt"
          grep -F 'LightManager.Type.SUN' "$ROOT/app/src/main/java/com/jackwilson/worldlife/ui/OpenWorldScreen.kt"
          ! grep -F 'unlit =' "$ROOT/app/src/main/java/com/jackwilson/worldlife/ui/OpenWorldScreen.kt"
          python "$ROOT/scripts/verify_static.py"

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'

      - name: Verify API 37
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

      - name: Gradle 9.3.1 no remote cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Core tests
        working-directory: /tmp/worldlife-v040/worldlife-rpg-android
        run: gradle --no-daemon :game-core:test

      - name: Compile landscape APK
        working-directory: /tmp/worldlife-v040/worldlife-rpg-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/worldlife-v040/worldlife-rpg-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          cp "$APK" /tmp/WorldLifeRPG-v0.4.0.apk
          sha256sum /tmp/WorldLifeRPG-v0.4.0.apk > /tmp/WorldLifeRPG-v0.4.0.apk.sha256
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" verify --verbose /tmp/WorldLifeRPG-v0.4.0.apk

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: WorldLifeRPG-v0.4.0-landscape-third-person
          path: |
            /tmp/WorldLifeRPG-v0.4.0.apk
            /tmp/WorldLifeRPG-v0.4.0.apk.sha256
          if-no-files-found: error
          retention-days: 7
