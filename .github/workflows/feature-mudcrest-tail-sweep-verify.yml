name: Feature Mudcrest Tail Sweep Verify

on:
  push:
    branches:
      - uhr-mudcrest-tail-sweep-runtime
    paths:
      - ".github/workflows/feature-mudcrest-tail-sweep-verify.yml"
      - "game/**"
      - "docs/00_project/USER_AUTHORIZED_CREATIVE_CANON_POLICY_2026-09-08.md"
      - "tests/quality/hunt01/**"

permissions:
  contents: read

concurrency:
  group: feature-mudcrest-tail-sweep-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: game
  APK_NAME: UnnamedHuntRPG-Hunt01-TailSweep-debug.apk

jobs:
  verify-tail-sweep:
    name: Static + Godot runtime + Android export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35 export tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Set up Godot 4.7.2 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android export environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot" build-evidence
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$HOME/.android/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000
          fi
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/timestamping_authority_url = ""
          EOF

      - name: Record tested identity
        shell: bash
        run: |
          set -euo pipefail
          { echo "branch=${GITHUB_REF_NAME}"; echo "commit=${GITHUB_SHA}"; godot --version; } | tee build-evidence/feature-identity.txt

      - name: Static Tail Sweep gate
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/quality/hunt01/hunt01_mudcrest_tail_sweep_preflight.py | tee build-evidence/tail-sweep-static.log
          grep -q "Gate: HUNT01_MUDCREST_TAIL_SWEEP_ATTACK_SOURCE_STATIC_VERIFIED" build-evidence/tail-sweep-static.log

      - name: Static regressions for modified owners
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/quality/hunt01/hunt01_mudcrest_head_sweep_preflight.py | tee build-evidence/head-sweep-static.log
          grep -q "Gate: HUNT01_MUDCREST_HEAD_SWEEP_ATTACK_SOURCE_STATIC_VERIFIED" build-evidence/head-sweep-static.log
          python3 tests/quality/hunt01/hunt01_mudcrest_wound_contact_preflight.py | tee build-evidence/wound-contact-static.log
          grep -q "Gate: HUNT01_MUDCREST_WOUND_CONTACT_SOURCE_STATIC_VERIFIED" build-evidence/wound-contact-static.log
          python3 tests/quality/hunt01/hunt01_hunter_health_injury_preflight.py | tee build-evidence/hunter-health-static.log
          grep -q "Gate: HUNT01_HUNTER_HEALTH_INJURY_SOURCE_STATIC_VERIFIED" build-evidence/hunter-health-static.log
          python3 tests/quality/hunt01/hunt01_hunter_defense_consequence_preflight.py | tee build-evidence/hunter-defense-static.log
          grep -q "Gate: HUNT01_HUNTER_DEFENSE_CONSEQUENCE_SOURCE_STATIC_VERIFIED" build-evidence/hunter-defense-static.log
          python3 tests/quality/hunt01/hunt01_status_application_preflight.py | tee build-evidence/status-application-static.log
          grep -q "Gate: HUNT01_GENERIC_STATUS_APPLICATION_SOURCE_STATIC_VERIFIED" build-evidence/status-application-static.log

      - name: Godot import and parse gate
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --verbose --editor --path "$PROJECT_PATH" --quit 2>&1 | tee build-evidence/godot-import-parse.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Failed loading resource|Cannot open file|ERROR:.*(parse|load|resource)" build-evidence/godot-import-parse.log; then exit 1; fi

      - name: Headless Tail Sweep runtime
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path "$PROJECT_PATH" --script "$GITHUB_WORKSPACE/game/tests/hunt01_mudcrest_tail_sweep_runtime_test.gd" 2>&1 | tee build-evidence/tail-sweep-runtime.log
          grep -q "Gate: HUNT01_MUDCREST_TAIL_SWEEP_ATTACK_RUNTIME_VERIFIED" build-evidence/tail-sweep-runtime.log

      - name: Headless Head Sweep regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path "$PROJECT_PATH" --script "$GITHUB_WORKSPACE/game/tests/hunt01_mudcrest_head_sweep_runtime_test.gd" 2>&1 | tee build-evidence/head-sweep-runtime.log
          grep -q "Gate: HUNT01_MUDCREST_HEAD_SWEEP_ATTACK_RUNTIME_VERIFIED" build-evidence/head-sweep-runtime.log

      - name: Headless wound/health/status regressions
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path "$PROJECT_PATH" --script "$GITHUB_WORKSPACE/game/tests/hunt01_mudcrest_wound_contact_runtime_test.gd" 2>&1 | tee build-evidence/wound-contact-runtime.log
          grep -q "Gate: HUNT01_MUDCREST_WOUND_CONTACT_RUNTIME_VERIFIED" build-evidence/wound-contact-runtime.log
          godot --headless --path "$PROJECT_PATH" --script "$GITHUB_WORKSPACE/game/tests/hunt01_hunter_health_injury_runtime_test.gd" 2>&1 | tee build-evidence/hunter-health-runtime.log
          grep -q "Gate: HUNT01_HUNTER_HEALTH_INJURY_RUNTIME_VERIFIED" build-evidence/hunter-health-runtime.log
          godot --headless --path "$PROJECT_PATH" --script "$GITHUB_WORKSPACE/game/tests/hunt01_status_application_runtime_test.gd" 2>&1 | tee build-evidence/status-application-runtime.log
          grep -q "Gate: HUNT01_GENERIC_STATUS_APPLICATION_RUNTIME_VERIFIED" build-evidence/status-application-runtime.log
          godot --headless --path "$PROJECT_PATH" --script "$GITHUB_WORKSPACE/game/tests/hunt01_hunter_downed_encounter_outcome_runtime_test.gd" 2>&1 | tee build-evidence/hunter-downed-runtime.log
          grep -q "Gate: HUNT01_HUNTER_DOWNED_ENCOUNTER_OUTCOME_RUNTIME_VERIFIED" build-evidence/hunter-downed-runtime.log

      - name: Broad production Hunt-01 smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path "$PROJECT_PATH" --script "$GITHUB_WORKSPACE/game/tests/region01_hunt01_graybox_runtime_test.gd" 2>&1 | tee build-evidence/production-integration.log
          grep -q "Gate: HUNT01_PRODUCTION_GRAYBOX_HEADLESS_INTEGRATION_VERIFIED" build-evidence/production-integration.log
          godot --headless --path "$PROJECT_PATH" --script "$GITHUB_WORKSPACE/game/tests/hunt01_combat_turn_shell_runtime_test.gd" 2>&1 | tee build-evidence/combat-shell-runtime.log
          grep -q "Gate: HUNT01_COMBAT_TURN_SHELL_RUNTIME_VERIFIED" build-evidence/combat-shell-runtime.log

      - name: Export Android debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p build/android
          godot --headless --verbose --path "$PROJECT_PATH" --export-debug "Android Debug" "$GITHUB_WORKSPACE/build/android/$APK_NAME" 2>&1 | tee build-evidence/android-export.log
          test -s "$GITHUB_WORKSPACE/build/android/$APK_NAME"
          sha256sum "$GITHUB_WORKSPACE/build/android/$APK_NAME" | tee build-evidence/android-apk-sha256.txt

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mudcrest-tail-sweep-verification-${{ github.sha }}
          path: build-evidence
          retention-days: 7

      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UnnamedHuntRPG-Hunt01-TailSweep-debug-${{ github.sha }}
          path: build/android/UnnamedHuntRPG-Hunt01-TailSweep-debug.apk
          retention-days: 7
