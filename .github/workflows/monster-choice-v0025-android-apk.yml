name: Monster Choice RPG v0.0.26 Android APK

on:
  push:
    branches:
      - monster-choice-v0025-apk-build
    paths:
      - ".github/workflows/monster-choice-v0025-android-apk.yml"

permissions:
  contents: read

concurrency:
  group: monster-choice-runtime-apk
  cancel-in-progress: true

env:
  PROJECT_PATH: monster_choice_rpg_v0026
  APK_NAME: MonsterChoiceRPG-v0.0.26-debug.apk
  SOURCE_SHA256: 85e9764f3d977338225a9e63076bbfdbd00d19e4426659f8fa6b6d13ed7fecfb
  SOURCE_URL: "https://sdmntpreastus2.oaiusercontent.com/files/00000000-25f8-81f6-b7da-fa62f0e21ad1/raw?se=2026-09-16T03%3A21%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=70f0cf18-f9f5-5715-a5d9-6d647585d15a&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T11%3A12%3A29Z&ske=2026-09-16T11%3A12%3A29Z&sks=b&skv=2026-02-06&sig=gem6kd69Kn3fjq2FTxzAHh/xCT7fO2kxwGeq%2B%2BhUWVQ%3D"

jobs:
  build-android-debug:
    name: Verify Godot 4.7.2 and export Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Fetch exact v0.0.26 runtime candidate from Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-evidence "$PROJECT_PATH"
          curl --fail --location --retry 3 --retry-delay 2 "$SOURCE_URL" -o source-v0.0.26.zip
          echo "$SOURCE_SHA256  source-v0.0.26.zip" | sha256sum -c - | tee build-evidence/source-sha256.txt
          unzip -q source-v0.0.26.zip -d "$PROJECT_PATH"
          test -f "$PROJECT_PATH/project.godot"
          test -f "$PROJECT_PATH/export_presets.cfg"
          grep -q 'version/code=26' "$PROJECT_PATH/export_presets.cfg"
          grep -q 'version/name="0.0.26"' "$PROJECT_PATH/export_presets.cfg"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install required Android SDK export tools
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.1" "platforms;android-35"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.1/aapt"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Set up Godot 4.7.2 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
          cache: false

      - name: Configure Godot Android editor settings and debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot" build-evidence
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -keyalg RSA -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -validity 10000
          fi
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/timestamping_authority_url = ""
          EOF

      - name: Record build identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "source_sha256=${SOURCE_SHA256}"
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
            godot --version
            java -version 2>&1 | head -n 1
            echo "ANDROID_HOME=${ANDROID_HOME}"
            "$SDKMANAGER" --list_installed | grep -E "platform-tools|build-tools;35.0.1|platforms;android-35" || true
          } | tee build-evidence/build-identity.txt

      - name: Godot import and parse gate
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --verbose --editor --path "$PROJECT_PATH" --quit 2>&1 | tee build-evidence/godot-import-parse.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|ERROR:.*(parse|load|resource)" build-evidence/godot-import-parse.log; then
            echo "Godot import/parse log contains a blocking error."
            exit 1
          fi

      - name: Run authored Godot test suite
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path "$PROJECT_PATH" --script tests/run_tests.gd 2>&1 | tee build-evidence/godot-tests.log
          grep -q "PASS: 20/20 core prototype test groups" build-evidence/godot-tests.log

      - name: Export Android debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p build/android
          godot --headless --verbose --path "$PROJECT_PATH" --export-debug "Android" "$GITHUB_WORKSPACE/build/android/$APK_NAME" 2>&1 | tee build-evidence/android-export.log
          test -s "build/android/$APK_NAME"
          unzip -t "build/android/$APK_NAME" | tee build-evidence/apk-integrity.txt
          sha256sum "build/android/$APK_NAME" | tee build-evidence/apk-sha256.txt
          stat -c 'bytes=%s' "build/android/$APK_NAME" | tee build-evidence/apk-size.txt
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "build/android/$APK_NAME" | tee build-evidence/apk-badging.txt
          grep -q "package: name='com.jackwilson.monsterchoicerpg'" build-evidence/apk-badging.txt
          grep -q "versionCode='26'" build-evidence/apk-badging.txt
          grep -q "versionName='0.0.26'" build-evidence/apk-badging.txt
          grep -q "sdkVersion:'24'" build-evidence/apk-badging.txt

      - name: Upload APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: MonsterChoiceRPG-v0.0.26-debug
          path: |
            build/android/MonsterChoiceRPG-v0.0.26-debug.apk
            build-evidence/
          if-no-files-found: error
          retention-days: 1
