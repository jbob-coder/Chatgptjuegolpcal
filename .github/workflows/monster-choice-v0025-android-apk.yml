name: Monster Choice RPG REWORK-002 Godot Gate

on:
  push:
    branches:
      - monster-choice-v0025-apk-build
    paths:
      - ".github/workflows/monster-choice-v0025-android-apk.yml"

permissions:
  contents: read

concurrency:
  group: monster-choice-rework-runtime-gate
  cancel-in-progress: true

env:
  PROJECT_PATH: monster_choice_rpg_rework_002
  SOURCE_SHA256: 4f1e61183c8c52ff941ec889de498fe2873cdff5507aa52c99d78c787e96016f
  SOURCE_URL: "https://sdmntpreastus2.oaiusercontent.com/files/00000000-c9a0-81f6-9d22-51f95870cfdd/raw?se=2026-09-17T01%3A05%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=f4ceefd5-9a3d-546a-8f73-293b7a82d541&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T18%3A45%3A19Z&ske=2026-09-17T18%3A45%3A19Z&sks=b&skv=2026-02-06&sig=ks%2BdpY9we%2BRn2fcg1xRLaqa7c7wuXk7V2r6eXOdzlkM%3D"

jobs:
  verify-rework-002:
    name: Verify REWORK-002 in Godot 4.7.2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4

      - name: Fetch exact current workspace from Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-evidence "$PROJECT_PATH"
          curl --fail --location --retry 3 --retry-delay 2 "$SOURCE_URL" -o current-workspace.zip
          echo "$SOURCE_SHA256  current-workspace.zip" | sha256sum -c - | tee build-evidence/source-sha256.txt
          unzip -q current-workspace.zip -d "$PROJECT_PATH"
          test -f "$PROJECT_PATH/project.godot"
          test -f "$PROJECT_PATH/scenes/rework/immersive_hunt.tscn"
          test -f "$PROJECT_PATH/tests/rework_scene_smoke.gd"

      - name: Set up Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
          cache: false

      - name: Record verification identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "source_sha256=${SOURCE_SHA256}"
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
            godot --version
          } | tee build-evidence/build-identity.txt

      - name: Godot import and parse gate
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --verbose --editor --path "$PROJECT_PATH" --quit 2>&1 | tee build-evidence/godot-import-parse.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|ERROR:.*(parse|load|resource)" build-evidence/godot-import-parse.log; then
            echo "Godot import/parse log contains a blocking error."
            exit 1
          fi

      - name: Run existing core Godot suite
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path "$PROJECT_PATH" --script tests/run_tests.gd 2>&1 | tee build-evidence/godot-core-tests.log
          grep -q "PASS: 20/20 core prototype test groups" build-evidence/godot-core-tests.log

      - name: Run REWORK-002 candidate scene smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path "$PROJECT_PATH" --script tests/rework_scene_smoke.gd 2>&1 | tee build-evidence/rework-scene-smoke.log
          grep -q "PASS: REWORK-002 Godot scene smoke" build-evidence/rework-scene-smoke.log

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MonsterChoiceRPG-REWORK-002-Godot-gate
          path: build-evidence/
          if-no-files-found: error
          retention-days: 1
