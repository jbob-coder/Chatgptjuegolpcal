name: Monster Choice RPG REWORK-008 Android APK

on:
  push:
    branches:
      - monster-choice-v0025-apk-build
    paths:
      - ".github/workflows/monster-choice-v0025-android-apk.yml"

permissions:
  contents: read

concurrency:
  group: monster-choice-rework008-android-apk
  cancel-in-progress: true

env:
  PROJECT_PATH: monster_choice_rpg_rework008_android
  APK_NAME: MonsterChoiceRPG-REWORK-008-debug.apk
  SOURCE_SHA256: 813043bbbef2c368a671923f55b5a6aa62d7bf29f2beaad91a1a73141748fdb0
  SOURCE_URL: "https://sdmntpreastus2.oaiusercontent.com/files/00000000-bb6c-81f6-93a2-590a51defd5c/raw?se=2026-09-17T05%3A51%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=c02d3a00-517d-5a91-89c0-8c2959a90846&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T02%3A53%3A39Z&ske=2026-09-18T02%3A53%3A39Z&sks=b&skv=2026-02-06&sig=%2Bf31QzF%2BASeRCs8pej0E0SBHBmYu/NJ428g1ZFccJiA%3D"

jobs:
  build-android-debug:
    name: Verify persisted REWORK-008 source and export Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Fetch exact persisted workspace from Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-evidence "$PROJECT_PATH"
          curl --fail --location --retry 3 --retry-delay 2 "$SOURCE_URL" -o current-workspace.zip
          echo "$SOURCE_SHA256  current-workspace.zip" | sha256sum -c - | tee build-evidence/source-sha256.txt
          unzip -q current-workspace.zip -d "$PROJECT_PATH"
          test -f "$PROJECT_PATH/project.godot"
          test -f "$PROJECT_PATH/export_presets.cfg"
          test -f "$PROJECT_PATH/scenes/rework/stoneveil_exploration.tscn"
          test -f "$PROJECT_PATH/scenes/rework/immersive_hunt.tscn"
          test -f "$PROJECT_PATH/src/world/campaign_state.gd"
          test -f "$PROJECT_PATH/tests/rework_lifecycle_persistence_smoke.gd"
          test -f "$PROJECT_PATH/tools/verify_rework_lifecycle_persistence.py"
          grep -q 'run/main_scene="res://scenes/rework/stoneveil_exploration.tscn"' "$PROJECT_PATH/project.godot"
          grep -q 'version/code=26' "$PROJECT_PATH/export_presets.cfg"
          grep -q 'version/name="0.0.26"' "$PROJECT_PATH/export_presets.cfg"
          grep -q 'package/unique_name="com.jackwilson.monsterchoicerpg"' "$PROJECT_PATH/export_presets.cfg"
          (
            cd "$PROJECT_PATH"
            sha256sum -c MANIFEST.sha256
            python3 tools/verify_rework_authority.py
            python3 tools/verify_rework_visual_foundation.py
            python3 tools/verify_rework_embodied_world.py
            python3 tools/verify_rework_visual_convergence.py
            python3 tools/verify_rework_lifecycle_persistence.py
          ) > build-evidence/source-static-check.log

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install required Android SDK export tools
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.1" "platforms;android-35"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.1/aapt"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Set up Godot 4.7.2 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
          cache: false

      - name: Configure Godot Android editor settings and debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot" build-evidence
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -keyalg RSA -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -validity 10000
          fi
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/timestamping_authority_url = ""
          EOF

      - name: Record build identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "source_sha256=${SOURCE_SHA256}"
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
            godot --version
            java -version 2>&1 | head -n 1
            echo "ANDROID_HOME=${ANDROID_HOME}"
            "$SDKMANAGER" --list_installed | grep -E "platform-tools|build-tools;35.0.1|platforms;android-35" || true
          } | tee build-evidence/build-identity.txt

      - name: Godot import and parse gate
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless --verbose --editor --path "$PROJECT_PATH" --quit 2>&1 | tee build-evidence/godot-import-parse.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|ERROR:.*(parse|load|resource)" build-evidence/godot-import-parse.log; then
            echo "Blocking Godot import/parse error detected."
            exit 1
          fi

      - name: Run core Godot suite
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/run_tests.gd 2>&1 | tee build-evidence/godot-core-tests.log
          grep -q "PASS: 20/20 core prototype test groups" build-evidence/godot-core-tests.log

      - name: Run REWORK-002 encounter smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/rework_scene_smoke.gd 2>&1 | tee build-evidence/rework002-scene-smoke.log
          grep -q "PASS: REWORK-002 Godot scene smoke" build-evidence/rework002-scene-smoke.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found" build-evidence/rework002-scene-smoke.log; then exit 1; fi

      - name: Run REWORK-003 exploration smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/rework_exploration_smoke.gd 2>&1 | tee build-evidence/rework003-exploration-smoke.log
          grep -q "PASS: REWORK-003 exploration-to-hunt Godot smoke" build-evidence/rework003-exploration-smoke.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found" build-evidence/rework003-exploration-smoke.log; then exit 1; fi

      - name: Run REWORK-004 return persistence smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/rework_return_persistence_smoke.gd 2>&1 | tee build-evidence/rework004-return-persistence-smoke.log
          grep -q "PASS: REWORK-004 return/persistence Godot smoke" build-evidence/rework004-return-persistence-smoke.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found" build-evidence/rework004-return-persistence-smoke.log; then exit 1; fi

      - name: Run REWORK-005 visual foundation smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/rework_visual_foundation_smoke.gd 2>&1 | tee build-evidence/rework005-visual-foundation-smoke.log
          grep -q "PASS: REWORK-005 visual foundation Godot smoke" build-evidence/rework005-visual-foundation-smoke.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found" build-evidence/rework005-visual-foundation-smoke.log; then exit 1; fi

      - name: Run REWORK-006 embodied world smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/rework_embodied_world_smoke.gd 2>&1 | tee build-evidence/rework006-embodied-world-smoke.log
          grep -q "PASS: REWORK-006 embodied world Godot smoke" build-evidence/rework006-embodied-world-smoke.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found" build-evidence/rework006-embodied-world-smoke.log; then exit 1; fi

      - name: Run REWORK-007 visual convergence smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/rework_visual_convergence_smoke.gd 2>&1 | tee build-evidence/rework007-visual-convergence-smoke.log
          grep -q "PASS: REWORK-007 visual convergence Godot smoke" build-evidence/rework007-visual-convergence-smoke.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found" build-evidence/rework007-visual-convergence-smoke.log; then exit 1; fi

      - name: Run REWORK-008 lifecycle persistence smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/rework_lifecycle_persistence_smoke.gd 2>&1 | tee build-evidence/rework008-lifecycle-persistence-smoke.log
          grep -q "PASS: REWORK-008 unified lifecycle persistence Godot smoke" build-evidence/rework008-lifecycle-persistence-smoke.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found" build-evidence/rework008-lifecycle-persistence-smoke.log; then exit 1; fi

      - name: Boot promoted main scene headlessly
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --quit-after 8 2>&1 | tee build-evidence/promoted-main-boot.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found|ERROR:.*(parse|load|resource)" build-evidence/promoted-main-boot.log; then
            echo "Blocking promoted-main runtime error detected."
            exit 1
          fi

      - name: Export Android debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p build/android
          godot --headless --verbose --path "$PROJECT_PATH" --export-debug "Android" "$GITHUB_WORKSPACE/build/android/$APK_NAME" 2>&1 | tee build-evidence/android-export.log
          test -s "build/android/$APK_NAME"
          unzip -t "build/android/$APK_NAME" | tee build-evidence/apk-integrity.txt
          sha256sum "build/android/$APK_NAME" | tee build-evidence/apk-sha256.txt
          stat -c 'bytes=%s' "build/android/$APK_NAME" | tee build-evidence/apk-size.txt
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "build/android/$APK_NAME" | tee build-evidence/apk-badging.txt
          grep -q "package: name='com.jackwilson.monsterchoicerpg'" build-evidence/apk-badging.txt
          grep -q "versionCode='26'" build-evidence/apk-badging.txt
          grep -q "versionName='0.0.26'" build-evidence/apk-badging.txt
          grep -q "sdkVersion:'24'" build-evidence/apk-badging.txt

      - name: Upload APK and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MonsterChoiceRPG-REWORK-008-Android-debug
          path: |
            build/android/MonsterChoiceRPG-REWORK-008-debug.apk
            build-evidence/
          if-no-files-found: error
          retention-days: 1
