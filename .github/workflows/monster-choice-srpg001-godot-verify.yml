name: Monster Choice RPG SRPG-001 Godot Verification

on:
  push:
    branches:
      - monster-choice-v0025-apk-build
    paths:
      - ".github/workflows/monster-choice-srpg001-godot-verify.yml"

permissions:
  contents: read

concurrency:
  group: monster-choice-srpg001-godot-verify
  cancel-in-progress: true

env:
  PROJECT_PATH: monster_choice_rpg_srpg001
  SOURCE_SHA256: fa142775996846998a583ba7b81d00298e3cccb488cbad489faba20c2970f62e
  SOURCE_URL: "https://sdmntpreastus2.oaiusercontent.com/files/00000000-5408-81f6-bd8f-6c9578b8355c/raw?se=2026-09-18T02%3A52%3A12Z&sp=r&sv=2026-02-06&sr=b&scid=279d8d9b-03a5-5852-82c5-4d9cfb45fb89&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T01%3A45%3A19Z&ske=2026-09-19T01%3A45%3A19Z&sks=b&skv=2026-02-06&sig=asKamcz90WQmXgvVkFBqJYciCPWl7LTE/XPmE1igzL8%3D"

jobs:
  verify-srpg001:
    name: Verify SRPG-001 exact source under Godot 4.7.2
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - name: Checkout temporary verification branch
        uses: actions/checkout@v4

      - name: Prepare verifier Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .verify-venv
          .verify-venv/bin/pip install --disable-pip-version-check pillow

      - name: Fetch exact Drive candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_PATH" build-evidence
          curl --fail --location --retry 3 --retry-delay 2 "$SOURCE_URL" -o source-srpg001.zip
          echo "$SOURCE_SHA256  source-srpg001.zip" | sha256sum -c - | tee build-evidence/source-sha256.txt
          unzip -q source-srpg001.zip -d "$PROJECT_PATH"
          test -f "$PROJECT_PATH/project.godot"
          test -f "$PROJECT_PATH/MANIFEST.sha256"
          test -f "$PROJECT_PATH/src/combat/srpg_grid_rules.gd"
          test -f "$PROJECT_PATH/src/presentation/layered_actor_2d.gd"
          test -f "$PROJECT_PATH/tests/srpg_grid_rules_smoke.gd"
          test -f "$PROJECT_PATH/tests/layered_actor_2d_smoke.gd"
          (
            cd "$PROJECT_PATH"
            sha256sum -c MANIFEST.sha256
            python3 tools/verify_reference_core.py
            python3 tools/verify_exploration_reference.py
            python3 tools/verify_expedition_cycle.py
            python3 tools/verify_settlement_reference.py
            python3 tools/verify_campaign_persistence_reference.py
            python3 tools/verify_equipment_reference.py
            python3 tools/verify_monster_diversity_reference.py
            python3 tools/verify_mireglass_campaign_reference.py
            python3 tools/verify_crossing_infrastructure_reference.py
            python3 tools/verify_recovery_pressure_reference.py
            python3 tools/verify_mastery_reference.py
            python3 tools/verify_mastery_tactics_reference.py
            python3 tools/verify_mastery_advanced_tactics_reference.py
            python3 tools/verify_mastery_lifecycle_reference.py
            "$GITHUB_WORKSPACE/.verify-venv/bin/python" tools/verify_pixel_art_assets.py
            "$GITHUB_WORKSPACE/.verify-venv/bin/python" tools/verify_pixel_direction.py
            "$GITHUB_WORKSPACE/.verify-venv/bin/python" tools/verify_pixel_scale_lab.py
            "$GITHUB_WORKSPACE/.verify-venv/bin/python" tools/verify_pixel_stoneveil_slice.py
            python3 tools/verify_rework_authority.py
            python3 tools/verify_rework_lifecycle_persistence.py
            python3 tools/verify_srpg_reference.py
            python3 tools/verify_monster_roster_seed.py
            python3 tools/verify_srpg_candidate.py
            python3 tools/verify_structure.py
            python3 tools/verify_source_checkpoint_tool.py
          ) > build-evidence/source-static-check.log

      - name: Set up Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
          cache: false

      - name: Record engine identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "branch=$GITHUB_REF_NAME"
            echo "commit=$GITHUB_SHA"
            echo "source_sha256=$SOURCE_SHA256"
            godot --version
          } | tee build-evidence/identity.txt

      - name: Godot import and parse gate
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --verbose --editor --path "$PROJECT_PATH" --quit 2>&1 | tee build-evidence/godot-import-parse.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|ERROR:.*(parse|load|resource)" build-evidence/godot-import-parse.log; then exit 1; fi

      - name: Run existing core Godot suite
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/run_tests.gd 2>&1 | tee build-evidence/godot-core-tests.log
          grep -q "PASS: 20/20 core prototype test groups" build-evidence/godot-core-tests.log

      - name: Run REWORK-008 lifecycle regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/rework_lifecycle_persistence_smoke.gd 2>&1 | tee build-evidence/rework008-smoke.log
          grep -q "PASS: REWORK-008 unified lifecycle persistence Godot smoke" build-evidence/rework008-smoke.log

      - name: Run PIXEL-002 and PIXEL-003 regression smokes
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/pixel_scale_lab_smoke.gd 2>&1 | tee build-evidence/pixel002-smoke.log
          grep -q "PASS: PIXEL-002 scale laboratory Godot smoke" build-evidence/pixel002-smoke.log
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/pixel_stoneveil_slice_smoke.gd 2>&1 | tee build-evidence/pixel003-smoke.log
          grep -q "PASS: PIXEL-003 Stoneveil terrain/camp slice Godot smoke" build-evidence/pixel003-smoke.log

      - name: Run SRPG-001 grid rules smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/srpg_grid_rules_smoke.gd 2>&1 | tee build-evidence/srpg001-grid-smoke.log
          grep -q "PASS: SRPG-001 grid rules Godot smoke" build-evidence/srpg001-grid-smoke.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found" build-evidence/srpg001-grid-smoke.log; then exit 1; fi

      - name: Run SRPG-001 layered actor smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/layered_actor_2d_smoke.gd 2>&1 | tee build-evidence/srpg001-layered-actor-smoke.log
          grep -q "PASS: SRPG-001 layered actor Godot smoke" build-evidence/srpg001-layered-actor-smoke.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found" build-evidence/srpg001-layered-actor-smoke.log; then exit 1; fi

      - name: Boot promoted main and PIXEL-003 scenes
        shell: bash
        run: |
          set -euo pipefail
          (cd "$PROJECT_PATH" && timeout 30s godot --headless --path . res://scenes/rework/stoneveil_exploration.tscn --quit-after 6) 2>&1 | tee build-evidence/main-scene-boot.log
          (cd "$PROJECT_PATH" && timeout 30s godot --headless --path . res://scenes/pixel/pixel_stoneveil_slice.tscn --quit-after 6) 2>&1 | tee build-evidence/pixel003-direct-boot.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found|ERROR:.*(parse|load|resource)" build-evidence/main-scene-boot.log build-evidence/pixel003-direct-boot.log; then exit 1; fi

      - name: Upload short-lived verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monster-choice-srpg001-evidence
          path: build-evidence/
          if-no-files-found: error
          retention-days: 1
