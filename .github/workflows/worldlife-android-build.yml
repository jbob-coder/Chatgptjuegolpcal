name: WorldLife OpenWorld Android APK

on:
  push:
    branches:
      - worldlife-apk-build
    paths:
      - 'worldlife_build_v2/**'
      - '.github/workflows/worldlife-android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v6

      - name: Reconstruct and verify open-world source archive
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          check_part() {
            expected="$1"
            file="$2"
            echo "$expected  $file" | sha256sum -c - || failed=1
          }
          check_part 83792c0f999ddbd43608eda757baf618b69397fb97b48851b1b573f14c385832 worldlife_build_v2/source.v2.part01
          check_part 423adf4356ca000b73dcba261196c9dbe41763e1523c5b09810ffff4902c3e18 worldlife_build_v2/source.v2.part020
          check_part 369c045916c9633d2e88e4840783bf8bb11df5a4cbe7dcd8a73c904685ac1b1e worldlife_build_v2/source.v2.part021
          check_part 36826f55715691bc0458f441176b683e1ee96749e8612ca6f59165fa3253267d worldlife_build_v2/source.v2.part022
          check_part 781f32ca2c133e2041f2306d9a9e52eb7e08a67b1e76e39368e1ade6498b153a worldlife_build_v2/source.v2.part023
          check_part ccffd1bf17955160b290204273ae97f2fe4d8e8fc2afb9cff941138180c8ad56 worldlife_build_v2/source.v2.part03
          check_part 10af4bea908e12420c150e299fd51b3e62534b8bce16402f6b5e16fbee87de43 worldlife_build_v2/source.v2.part04
          check_part fb177a7184fc8e5e77d8e4e67c1a414d544835a7489730093f5f898556b284ff worldlife_build_v2/source.v2.part05
          check_part e19c59b5319f19412d65f22d2eba38704bc66f1711dda6353e84865548859380 worldlife_build_v2/source.v2.part06
          check_part 64dc7f718fffd94dbe768edc852fb7483076ed0784b8b3b200159c17f33054aa worldlife_build_v2/source.v2.part07
          check_part 5f2f4dbda521232b87b3660c61876c3d6c68496b918f95c06ee2c194a9af29ee worldlife_build_v2/source.v2.part08
          check_part c9bd889f980b4bd5a04befe2221f4d95c07c0ec149c285f1c5d5df48500ec961 worldlife_build_v2/source.v2.part09
          if [ "$failed" -ne 0 ]; then
            echo "One or more source transport segments failed integrity verification."
            exit 1
          fi
          cat \
            worldlife_build_v2/source.v2.part01 \
            worldlife_build_v2/source.v2.part020 \
            worldlife_build_v2/source.v2.part021 \
            worldlife_build_v2/source.v2.part022 \
            worldlife_build_v2/source.v2.part023 \
            worldlife_build_v2/source.v2.part03 \
            worldlife_build_v2/source.v2.part04 \
            worldlife_build_v2/source.v2.part05 \
            worldlife_build_v2/source.v2.part06 \
            worldlife_build_v2/source.v2.part07 \
            worldlife_build_v2/source.v2.part08 \
            worldlife_build_v2/source.v2.part09 \
            > /tmp/worldlife_v2.b64
          echo "9602d56236f4d74ea7fceb63f8a9e00051cc7f812d67818258223191a44be31b  /tmp/worldlife_v2.b64" | sha256sum -c -
          base64 -d /tmp/worldlife_v2.b64 > /tmp/WorldLifeRPG-openworld-source-ci.zip
          echo "58686f5de9bcf4151b071792c618d6b3388bf6abe4a8aea11daa0563b5a0b03e  /tmp/WorldLifeRPG-openworld-source-ci.zip" | sha256sum -c -
          mkdir -p /tmp/worldlife-v2
          unzip -q /tmp/WorldLifeRPG-openworld-source-ci.zip -d /tmp/worldlife-v2

      - name: Verify pinned Android build baseline
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/worldlife-v2/worldlife-rpg-android
          grep -F 'id("com.android.application") version "9.1.1" apply false' "$ROOT/build.gradle.kts"
          grep -F 'versionCode = 2' "$ROOT/app/build.gradle.kts"
          grep -F 'versionName = "0.2.0"' "$ROOT/app/build.gradle.kts"
          grep -F 'io.github.sceneview:sceneview:4.33.0' "$ROOT/app/build.gradle.kts"
          test -s "$ROOT/app/dev-signing.jks"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up current Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'

      - name: Verify Android 17 SDK is available
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
          test -f "$ANDROID_SDK_ROOT/platforms/android-37/android.jar"
          echo "Using Android SDK platform: $ANDROID_SDK_ROOT/platforms/android-37.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Run static verifier
        working-directory: /tmp/worldlife-v2/worldlife-rpg-android
        run: python3 scripts/verify_static.py

      - name: Test game core
        working-directory: /tmp/worldlife-v2/worldlife-rpg-android
        run: gradle --no-daemon :game-core:test

      - name: Build open-world debug APK
        working-directory: /tmp/worldlife-v2/worldlife-rpg-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/worldlife-v2/worldlife-rpg-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          echo "APK size: $(stat -c%s "$APK") bytes"
          echo "APK SHA-256: $(sha256sum "$APK" | awk '{print $1}')"
          unzip -t "$APK" >/dev/null
          if [ -x "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" ]; then
            "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" verify --verbose "$APK"
          fi

      - name: Upload WorldLife OpenWorld APK
        uses: actions/upload-artifact@v4
        with:
          name: WorldLifeRPG-openworld-v0.2.0-apk
          path: /tmp/worldlife-v2/worldlife-rpg-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
