name: WorldLife OpenWorld Android APK

on:
  push:
    branches:
      - worldlife-apk-build
    paths:
      - 'worldlife_build_v2/**'
      - '.github/workflows/worldlife-android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v6

      - name: Reconstruct and verify open-world source archive
        shell: bash
        run: |
          set -euo pipefail
          cat worldlife_build_v2/source.v2.part* > /tmp/worldlife_v2.b64
          echo "9602d56236f4d74ea7fceb63f8a9e00051cc7f812d67818258223191a44be31b  /tmp/worldlife_v2.b64" | sha256sum -c -
          base64 -d /tmp/worldlife_v2.b64 > /tmp/WorldLifeRPG-openworld-source-ci.zip
          echo "58686f5de9bcf4151b071792c618d6b3388bf6abe4a8aea11daa0563b5a0b03e  /tmp/WorldLifeRPG-openworld-source-ci.zip" | sha256sum -c -
          mkdir -p /tmp/worldlife-v2
          unzip -q /tmp/WorldLifeRPG-openworld-source-ci.zip -d /tmp/worldlife-v2

      - name: Verify pinned Android build baseline
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/worldlife-v2/worldlife-rpg-android
          grep -F 'id("com.android.application") version "9.1.1" apply false' "$ROOT/build.gradle.kts"
          grep -F 'versionCode = 2' "$ROOT/app/build.gradle.kts"
          grep -F 'versionName = "0.2.0"' "$ROOT/app/build.gradle.kts"
          grep -F 'io.github.sceneview:sceneview:4.33.0' "$ROOT/app/build.gradle.kts"
          test -s "$ROOT/app/dev-signing.jks"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up current Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'

      - name: Verify Android 17 SDK is available
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
          test -f "$ANDROID_SDK_ROOT/platforms/android-37/android.jar"
          echo "Using Android SDK platform: $ANDROID_SDK_ROOT/platforms/android-37.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Run static verifier
        working-directory: /tmp/worldlife-v2/worldlife-rpg-android
        run: python3 scripts/verify_static.py

      - name: Test game core
        working-directory: /tmp/worldlife-v2/worldlife-rpg-android
        run: gradle --no-daemon :game-core:test

      - name: Build open-world debug APK
        working-directory: /tmp/worldlife-v2/worldlife-rpg-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/worldlife-v2/worldlife-rpg-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          echo "APK size: $(stat -c%s "$APK") bytes"
          echo "APK SHA-256: $(sha256sum "$APK" | awk '{print $1}')"
          unzip -t "$APK" >/dev/null
          if [ -x "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" ]; then
            "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" verify --verbose "$APK"
          fi

      - name: Upload WorldLife OpenWorld APK
        uses: actions/upload-artifact@v4
        with:
          name: WorldLifeRPG-openworld-v0.2.0-apk
          path: /tmp/worldlife-v2/worldlife-rpg-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
