name: WorldLife Android APK

on:
  push:
    branches:
      - worldlife-apk-build
    paths:
      - 'worldlife_build/**'
      - '.github/workflows/worldlife-android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v6

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat worldlife_build/source.part* > /tmp/worldlife.b64
          echo "960e2c5b0cbc81f5406189340b9c83e46b2c48cede24cd19b8af46dee0153665  /tmp/worldlife.b64" | sha256sum -c -
          base64 -d /tmp/worldlife.b64 > /tmp/WorldLifeRPG-Android-vertical-slice.zip
          echo "ff72f4f3ad98a06e50df909eebce3977f5229e9fd88897c24216da5f9cd05af2  /tmp/WorldLifeRPG-Android-vertical-slice.zip" | sha256sum -c -
          mkdir -p /tmp/worldlife
          unzip -q /tmp/WorldLifeRPG-Android-vertical-slice.zip -d /tmp/worldlife

      - name: Apply verified AGP compatibility repair
        shell: bash
        run: |
          set -euo pipefail
          FILE=/tmp/worldlife/worldlife-rpg-android/build.gradle.kts
          grep -F 'version "9.1.2"' "$FILE"
          sed -i 's/version "9.1.2"/version "9.1.1"/' "$FILE"
          grep -F 'id("com.android.application") version "9.1.1" apply false' "$FILE"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up current Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'

      - name: Install Android SDK 37 preview
        shell: bash
        run: |
          set -euo pipefail
          android sdk install --canary platforms/android-37 build-tools/37.0.0
          test -f "$ANDROID_SDK_ROOT/platforms/android-37/android.jar"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Test game core
        working-directory: /tmp/worldlife/worldlife-rpg-android
        run: gradle --no-daemon :game-core:test

      - name: Build debug APK
        working-directory: /tmp/worldlife/worldlife-rpg-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/worldlife/worldlife-rpg-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          echo "APK size: $(stat -c%s "$APK") bytes"
          echo "APK SHA-256: $(sha256sum "$APK" | awk '{print $1}')"
          unzip -t "$APK" >/dev/null

      - name: Upload WorldLife APK
        uses: actions/upload-artifact@v4
        with:
          name: WorldLifeRPG-debug-apk
          path: /tmp/worldlife/worldlife-rpg-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
