name: Monster Choice RPG PIXEL-003 Godot Verification

on:
  push:
    branches:
      - monster-choice-v0025-apk-build
    paths:
      - ".github/workflows/monster-choice-pixel003-godot-verify.yml"

permissions:
  contents: read

concurrency:
  group: monster-choice-pixel003-godot-verify
  cancel-in-progress: true

env:
  PROJECT_PATH: monster_choice_rpg_pixel003
  SOURCE_SHA256: e7c0790f8fc510ea04d8c3717b60306786b4c6681b3f452364b6d264434b6528
  SOURCE_URL: "https://sdmntpreastus2.oaiusercontent.com/files/00000000-fdd4-81f6-be38-2b17705ef675/raw?se=2026-09-18T01%3A58%3A18Z&sp=r&sv=2026-02-06&sr=b&scid=e30ca2db-b96b-5596-b7c3-4c5e9bcc48b3&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T13%3A09%3A10Z&ske=2026-09-18T13%3A09%3A10Z&sks=b&skv=2026-02-06&sig=b0YHSRrkvDo0gB1nbf1EdHxEJUhpUoV1%2FauDt4Q45vU%3D"

jobs:
  verify-pixel003:
    name: Verify PIXEL-003 exact source under Godot 4.7.2
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout temporary verification branch
        uses: actions/checkout@v4

      - name: Prepare verifier Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .verify-venv
          .verify-venv/bin/pip install --disable-pip-version-check pillow

      - name: Fetch exact Drive candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_PATH" build-evidence
          curl --fail --location --retry 3 --retry-delay 2 "$SOURCE_URL" -o source-pixel003.zip
          echo "$SOURCE_SHA256  source-pixel003.zip" | sha256sum -c - | tee build-evidence/source-sha256.txt
          unzip -q source-pixel003.zip -d "$PROJECT_PATH"
          test -f "$PROJECT_PATH/project.godot"
          test -f "$PROJECT_PATH/MANIFEST.sha256"
          test -f "$PROJECT_PATH/scenes/pixel/pixel_stoneveil_slice.tscn"
          test -f "$PROJECT_PATH/src/ui/pixel/pixel_stoneveil_slice.gd"
          test -f "$PROJECT_PATH/tests/pixel_stoneveil_slice_smoke.gd"
          (
            cd "$PROJECT_PATH"
            sha256sum -c MANIFEST.sha256
            python3 tools/verify_structure.py
            python3 tools/verify_android_config.py
            python3 tools/verify_rework_authority.py
            python3 tools/verify_rework_lifecycle_persistence.py
            "$GITHUB_WORKSPACE/.verify-venv/bin/python" tools/verify_pixel_direction.py
            "$GITHUB_WORKSPACE/.verify-venv/bin/python" tools/verify_pixel_scale_lab.py
            "$GITHUB_WORKSPACE/.verify-venv/bin/python" tools/verify_pixel_stoneveil_slice.py
            python3 tools/verify_source_checkpoint_tool.py
          ) > build-evidence/source-static-check.log

      - name: Set up Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
          cache: false

      - name: Record engine identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "branch=$GITHUB_REF_NAME"
            echo "commit=$GITHUB_SHA"
            echo "source_sha256=$SOURCE_SHA256"
            godot --version
          } | tee build-evidence/identity.txt

      - name: Godot import and parse gate
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --verbose --editor --path "$PROJECT_PATH" --quit 2>&1 | tee build-evidence/godot-import-parse.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|ERROR:.*(parse|load|resource)" build-evidence/godot-import-parse.log; then exit 1; fi

      - name: Run existing core Godot suite
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/run_tests.gd 2>&1 | tee build-evidence/godot-core-tests.log
          grep -q "PASS: 20/20 core prototype test groups" build-evidence/godot-core-tests.log

      - name: Run REWORK-008 lifecycle persistence regression smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/rework_lifecycle_persistence_smoke.gd 2>&1 | tee build-evidence/rework008-lifecycle-persistence-smoke.log
          grep -q "PASS: REWORK-008 unified lifecycle persistence Godot smoke" build-evidence/rework008-lifecycle-persistence-smoke.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found" build-evidence/rework008-lifecycle-persistence-smoke.log; then exit 1; fi

      - name: Run PIXEL-002 scale lab regression smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/pixel_scale_lab_smoke.gd 2>&1 | tee build-evidence/pixel002-scale-lab-smoke.log
          grep -q "PASS: PIXEL-002 scale laboratory Godot smoke" build-evidence/pixel002-scale-lab-smoke.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found" build-evidence/pixel002-scale-lab-smoke.log; then exit 1; fi

      - name: Run PIXEL-003 Stoneveil slice smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s godot --headless --path "$PROJECT_PATH" --script tests/pixel_stoneveil_slice_smoke.gd 2>&1 | tee build-evidence/pixel003-stoneveil-smoke.log
          grep -q "PASS: PIXEL-003 Stoneveil terrain/camp slice Godot smoke" build-evidence/pixel003-stoneveil-smoke.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found" build-evidence/pixel003-stoneveil-smoke.log; then exit 1; fi

      - name: Boot promoted main scene directly
        shell: bash
        run: |
          set -euo pipefail
          (cd "$PROJECT_PATH" && timeout 30s godot --headless --path . res://scenes/rework/stoneveil_exploration.tscn --quit-after 6) 2>&1 | tee build-evidence/main-scene-boot.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found|ERROR:.*(parse|load|resource)" build-evidence/main-scene-boot.log; then exit 1; fi

      - name: Boot PIXEL-003 scene directly
        shell: bash
        run: |
          set -euo pipefail
          (cd "$PROJECT_PATH" && timeout 30s godot --headless --path . res://scenes/pixel/pixel_stoneveil_slice.tscn --quit-after 6) 2>&1 | tee build-evidence/pixel003-direct-boot.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|Failed to compile|Failed loading resource|Failed to load script|Invalid get index|Invalid call|Node not found|ERROR:.*(parse|load|resource)" build-evidence/pixel003-direct-boot.log; then exit 1; fi

      - name: Upload short-lived verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monster-choice-pixel003-evidence
          path: build-evidence/
          if-no-files-found: error
          retention-days: 1
