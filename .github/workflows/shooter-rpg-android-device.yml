name: Shooter RPG Android Device APK

on:
  push:
    branches:
      - shooter-rpg
      - shooter-rpg-android-device-001
    paths:
      - 'shooter_game/**'
      - '.github/workflows/shooter-rpg-android-device.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shooter-rpg-android-device-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: shooter_game
  APK_NAME: ShooterRPG-AndroidDevice001-debug.apk

jobs:
  build-android-debug:
    name: Verify and export Shooter RPG Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo 'sdkmanager is not available on the GitHub runner.'
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$SDKMANAGER" --version

      - name: Install Android SDK export tools
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35'

      - name: Set up Godot 4.7.2 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Configure Android debug signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot" build-evidence build/android
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -keyalg RSA -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -dname 'CN=Android Debug,O=Android,C=US' \
              -validity 10000
          fi
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/timestamping_authority_url = ""
          EOF

      - name: Record build identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
            godot --version
            java -version 2>&1 | head -n 1
            echo "ANDROID_HOME=${ANDROID_HOME}"
            "$SDKMANAGER" --list_installed | grep -E 'platform-tools|build-tools;35.0.1|platforms;android-35' || true
          } | tee build-evidence/build-identity.txt

      - name: Shooter RPG static gates
        shell: bash
        run: |
          set -euo pipefail
          python shooter_game/tests/scaffold_static_preflight.py | tee build-evidence/scaffold-static.log
          python shooter_game/tests/player_camera_static_preflight.py | tee build-evidence/player-camera-static.log
          python shooter_game/tests/mobile_touch_static_preflight.py | tee build-evidence/mobile-touch-static.log
          python shooter_game/tests/android_export_static_preflight.py | tee build-evidence/android-export-static.log

      - name: Godot import and parse gate
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --verbose --editor --path "$PROJECT_PATH" --quit-after 2 2>&1 | tee build-evidence/godot-import-parse.log
          if grep -Eiq 'SCRIPT ERROR|Parse Error|Failed loading resource|Cannot open file|ERROR:.*(parse|load|resource)' build-evidence/godot-import-parse.log; then
            echo 'Godot import/parse log contains a blocking error.'
            exit 1
          fi

      - name: Headless runtime smokes
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path "$PROJECT_PATH" --script res://tests/scaffold_smoke.gd | tee build-evidence/scaffold-smoke.log
          godot --headless --path "$PROJECT_PATH" --script res://tests/player_camera_smoke.gd | tee build-evidence/player-camera-smoke.log
          godot --headless --path "$PROJECT_PATH" --script res://tests/mobile_touch_smoke.gd | tee build-evidence/mobile-touch-smoke.log

      - name: Export Android debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          godot --headless --verbose --path "$PROJECT_PATH" --export-debug 'Android Debug' "$GITHUB_WORKSPACE/build/android/$APK_NAME" 2>&1 | tee build-evidence/android-export.log
          test -s "build/android/$APK_NAME"
          unzip -t "build/android/$APK_NAME" | tee build-evidence/apk-integrity.txt
          sha256sum "build/android/$APK_NAME" | tee build-evidence/apk-sha256.txt
          stat -c 'bytes=%s' "build/android/$APK_NAME" | tee build-evidence/apk-size.txt

      - name: Inspect Android package
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.1/aapt"
          "$AAPT" dump badging "build/android/$APK_NAME" | tee build-evidence/apk-badging.txt
          "$AAPT" dump permissions "build/android/$APK_NAME" | tee build-evidence/apk-permissions.txt
          grep -q "package: name='com.jbobcoder.shooterrpg'" build-evidence/apk-badging.txt

      - name: Upload APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: ShooterRPG-AndroidDevice001-debug
          path: |
            build/android/ShooterRPG-AndroidDevice001-debug.apk
            build-evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Device gate summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Shooter RPG Android Device APK'
            echo ''
            echo '- Perspective: first-person'
            echo '- Target horizontal FOV: 115 degrees'
            echo '- Movement: jump + wall jump'
            echo '- Mobile: left movement + right look + jump/action controls'
            echo '- APK is debug-signed for direct device testing only.'
            echo '- CI success verifies export/integrity/package metadata, not real-phone feel or performance.'
          } >> "$GITHUB_STEP_SUMMARY"
