schema_version: 1.0.0
charter_id: EARTH_RESIDENCY_CONTRIBUTION_CHARTER_2670_V1
authority: USER_DIRECTIVE_PLUS_ORIGINAL_CAMPAIGN_CANON
core_rule: Earth residency is a scarce protected privilege, not an unconditional right
  for every human citizen. People unable to sustain Earth residency and lacking protected
  contribution status, sponsorship or another exemption are normally routed into the
  offworld settlement system.
policy_goals:
- keep Earth population within hardened infrastructure capacity
- preserve the homeworld as the human civilization reserve
- reward service that materially preserved Earth or humanity
- concentrate strategic institutions and irreplaceable expertise
- move population growth and low-capital labor demand toward Green and Orange settlements
protected_residency_categories:
- category: war_service
  examples:
  - honorably completed qualifying wartime service
  - documented planetary-defense service
  - severe service disability
  family_effect: registered spouse/partner, dependent children and certain dependent
    parents can receive derivative protection subject to household review
- category: exceptional_contribution
  examples:
  - major reconstruction work
  - life-saving medical/scientific contribution
  - critical portal/crystal breakthrough
  - civil defense achievement
  - large-scale food/water/infrastructure preservation
  family_effect: immediate dependent household usually receives protected sponsorship
- category: strategic_office_or_skill
  examples:
  - top defense command
  - critical infrastructure command
  - treaty liaison
  - high-level crystal engineering
  - certain medical/research specialties
  family_effect: residency persists while status or retained-service obligation remains
    valid
- category: legacy_institutional_sponsorship
  examples:
  - recognized Great Guild leadership
  - recognized Great House principal family
  - interworld judicial/diplomatic authority
  - major academy or archive office
  family_effect: family residency can persist through charters and trusts, creating
    durable elite lineages
- category: self_supported_residency
  examples:
  - household can meet Earth housing, tax, insurance and reserve requirements without
    public relocation support
  family_effect: dependents remain under the household residency umbrella while legally
    dependent
relocation_trigger:
  normal_conditions:
  - loss of qualifying sponsor or protected status
  - persistent inability to meet housing/support obligations
  - expiry of temporary Earth work or study residency
  - civil-capacity pressure in an overfull district
  not_instant: Ordinary cases pass through notice, review, destination matching and
    transport scheduling rather than street-level expulsion.
  standard_grace_period_days: 120
  appeal_exists: true
  appeal_limits: Appeal can correct records, contribution status, medical hardship,
    family dependency or destination mismatch; it does not create unlimited Earth
    housing capacity.
family_rules:
  default: Authorities try to keep legally dependent households together during relocation.
  split_conditions:
  - adult family member holds independent Earth right
  - medical dependency requires Earth treatment
  - military/strategic assignment
  - custody or court order
  inheritance: Elite or veteran family protection can be durable but is not automatically
    infinite for every descendant; each charter defines the derivative generations
    or sponsorship rules.
class_effects:
- Earth property and long-term leases are wealth assets because residency itself is
  scarce.
- Veteran and high-contribution families form a respected service aristocracy even
  when they are not personally rich.
- Very wealthy households can often satisfy self-support rules, producing an economic
  upper class beside the service elite.
- Major guilds and Great Houses accumulate Earth-based headquarters and family networks,
  making the homeworld the center of interworld decision-making.
abuse_and_friction:
- fraudulent contribution claims
- political sponsorship
- favoritism by Great Houses/guilds
- families hiding insolvency to delay relocation
- frontier settlements competing for skilled relocatees
- public anger when elites appear exempt from rules applied to ordinary households
gameplay_rule: Jack or Sol only knows a person's residency category if the information
  is public, disclosed, observed through procedure or otherwise learned causally.
