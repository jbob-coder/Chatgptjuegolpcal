schema_version: 1.0.0
record_id: EARTH_POWER_CENTERS_AND_GUILD_RESIDENCY_2670_V1
authority: USER_DIRECTIVE_PLUS_SOURCE_TRANSFORMED_PLUS_ORIGINAL_CAMPAIGN_CANON
principle: Most institutions capable of setting interworld rules, controlling strategic
  trade, certifying abilities, financing portal infrastructure or coordinating planetary
  defense keep their principal headquarters on Earth. Their leading families therefore
  disproportionately live on Earth.
earth_based_power_centers:
- type: Great Guilds
  functions:
  - hunter certification
  - crystal appraisal
  - crafting standards
  - expedition insurance
  - frontier contracts
  - resource auctions
- type: Great Houses
  functions:
  - ability lineages
  - private security
  - industrial holdings
  - political sponsorship
  - offworld estates and settlements
- type: Planetary Defense Command
  functions:
  - invasion response
  - portal lockdown authority
  - strategic reserves
  - academy command links
- type: Interworld Trade and Crystal Exchange
  functions:
  - benchmark pricing
  - reserve contracts
  - shipping/portal allocations
  - sanctions and emergency requisitions
- type: Treaty and Diplomatic Institutions
  functions:
  - Halcyon Gate Concord liaison
  - Kharvori relations
  - border dispute arbitration
  - protected-world registry
- type: Major Academies and Research Institutes
  functions:
  - ability research
  - crystal science
  - military leadership
  - medical specialization
  - planet survey standards
offworld_structure: Branches, mines, hunting halls, settlement councils and field
  commands operate offworld, but strategic boards and family leadership usually return
  to Earth when wealth and residency permit.
source_transform_basis:
- Source audit chapter 594 keeps major military power Earth-based while major families
  establish territories in beast-system/offworld space.
- The game converts that pattern into Earth-headquartered guild/house networks with
  offworld branches.
clarification: The word Guild is the game term used here for the user's reference
  to major guides/guild-like world organizations; this can be renamed later without
  changing the structure.
