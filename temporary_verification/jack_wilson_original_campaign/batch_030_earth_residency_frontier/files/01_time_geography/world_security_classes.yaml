schema_version: 2.0.0
classification_id: WORLD_SECURITY_CLASSES_2670_V2
authority: USER_DIRECTIVE_PLUS_SOURCE_DERIVED_PLUS_ORIGINAL_CAMPAIGN_CANON
purpose: Controlling settlement-safety coding for Earth and portal-linked worlds.
  Green/Orange/Red are retained from the verified source world structure; the game
  adds Earth Bastion, explicit certification thresholds, relocation rules, and regional
  classification.
classes:
- code: EARTH_BASTION
  display: Earth / Bastion
  ordinary_civilian_settlement: true
  relocation_destination: false
  definition: The protected human homeworld. Full planetary civilization, layered
    invasion defenses, deep reserves, mature institutions and the highest residency
    barrier.
- code: GREEN
  display: Green World / Green Settlement
  ordinary_civilian_settlement: true
  relocation_destination: true
  definition: Planet or bounded settlement region has completed the civil full-scan
    standard and sustained follow-up monitoring. No known beast, ecology, geological
    process, hostile polity, portal anomaly or other single identified threat is judged
    capable of destroying the protected settlement outright under its certified defense
    design.
  required_evidence:
  - orbital and atmospheric survey
  - surface mapping
  - major subsurface hazard survey
  - beast-distribution survey
  - high-tier target search
  - portal/anomaly survey
  - water/food/toxin baseline
  - multi-season monitoring where seasons exist
  - evacuation and shelter validation
  - independent re-scan before certification
  risk_note: Green means secured for ordinary settlement, not harmless. Accidents,
    crime, isolated beasts, storms, equipment failures and newly emerging threats
    remain possible.
- code: ORANGE
  display: Orange World / Orange Settlement
  ordinary_civilian_settlement: true
  relocation_destination: true
  definition: Habitable and economically usable but incompletely explored or containing
    known strong-beast territories. A defended settlement can survive with functioning
    walls, shelters, hunters, sensors, medical capacity and evacuation routes, but
    lethal encounters remain a normal background risk.
  required_evidence:
  - verified habitable settlement site
  - mapped safe approach corridor
  - known evacuation route
  - beast-watch network
  - defensible shelter core
  - water/food supply
  - medical stabilization capacity
  - continuous exploration program
  risk_note: Residents accept that unmapped territory, migrating beasts, rare high-tier
    predators, environmental shifts or failed defenses can kill people. Local life
    adapts around that fact.
- code: RED
  display: Red Expedition Zone
  ordinary_civilian_settlement: false
  relocation_destination: false
  definition: Military, scientific, hunting or industrial access only. Threat level
    or uncertainty is too high for ordinary dependent-family settlement.
- code: BLACK
  display: Black / Exclusion
  ordinary_civilian_settlement: false
  relocation_destination: false
  definition: Quarantined, treaty-sealed, civilization-level threat, unstable portal,
    catastrophic ecology or otherwise prohibited region.
certification_rules:
  green_can_downgrade: true
  orange_can_upgrade: true
  classification_is_regional: true
  note: A planet may contain differently classified regions. A Green settlement does
    not automatically make an entire planet Green.
source_transform_basis:
- 'Verified source-derived Chapter 59 reconstruction: portal destinations use green,
  orange, and red colors.'
- 'Verified source-derived Chapter 59 reconstruction: Green destinations are explored
  worlds with established human shelters; even Green destinations remain dangerous.'
- 'Verified source-derived Chapter 59 reconstruction: Orange destinations are incompletely
  explored, may contain shelters, remain incompletely secured, and can contain beasts
  too strong for normal settlement.'
- 'Verified source-derived Chapter 59 reconstruction: Red destinations are unexplored
  and have no shelters for ordinary civilians; normal exploration is military/Traveller
  activity.'
- 'Source audit Chapters 597-598: a remote planetary scan project was intended to
  identify beast distributions including high-tier targets.'
- 'User directive adds the stronger game-world Green rule: full civil scan and no
  known threat judged capable of destroying the certified settlement under its validated
  defense design; Orange remains livable but persistently lethal.'
