schema_version: 1.0.0
system_id: PLANET_SURVEY_AND_GREEN_CERTIFICATION_2670_V1
authority: SOURCE_TRANSFORMED_PLUS_ORIGINAL_CAMPAIGN_CANON
purpose: Defines what "fully scanned" means for Green certification without pretending
  any survey can prove absolute safety.
scan_layers:
- orbital terrain and thermal mapping
- atmospheric/toxicology profile
- hydrology and food-chain sampling
- deep radar/seismic mapping around settlement zones
- crystal-vein/resonance mapping
- beast density and migration mapping
- high-tier target search
- portal/anomaly sweep
- microbial/parasite screening
- multi-season repeat scans
- autonomous probe transects
- human field verification of ambiguous regions
green_threshold:
- all settlement-critical zones surveyed
- no unresolved civilization-ending/high-tier threat inside certified response radius
- known high-risk species have response doctrine
- evacuation/shelter test passes
- survey confidence meets civil standard
- continuous monitoring funded and staffed
orange_trigger:
- significant unmapped land remains
- high-tier beasts exist outside controlled zones
- migration pathways are only partly understood
- seasonal/environmental behavior has not completed long-term observation
- settlement survives through defense rather than low hazard
source_basis: Source audit chapters 597-598 records a project intended to scan a planet
  remotely and identify beast distribution including high-tier targets. This game
  system generalizes that concept into the civil certification stack.
