schema_version: 1.0.0
system_id: EARTH_TO_FRONTIER_POPULATION_FLOW_2670_V1
authority: USER_DIRECTIVE_PLUS_SOURCE_TRANSFORMED_PLUS_ORIGINAL_CAMPAIGN_CANON
normal_flow:
- Earth residency review identifies households without protected/sponsored/self-supported
  status.
- Destination office matches household skills, health, family size, debts, language
  and risk tolerance against Green/Orange settlement demand.
- Green destinations are preferred for dependents, medically vulnerable households
  and ordinary relocation.
- Orange destinations are used for adults/households able to meet survival requirements
  when Green capacity is unavailable or when high-wage frontier contracts make Orange
  economically preferable.
- Transport grants include a settlement berth, basic equipment allowance and a limited
  arrival-support period rather than permanent Earth-level welfare.
green_package:
- assigned shelter or housing unit
- basic local clothing/environment kit
- civil ID and settlement network access
- food/water starter allocation
- medical intake
- local hazard orientation
- job/skills placement
- evacuation route briefing
orange_package:
- all Green-package essentials where available
- personal emergency beacon
- field medical kit
- settlement-grade protective clothing or armor inserts
- beast-warning receiver
- route-map cache usable offline
- shelter/bunker access token
- mandatory local survival course
- weapon/tool licensing path where local law permits
- first-season hunter/guide briefing
economic_logic:
  earth: safe, high wages and services but extremely high residency/housing cost
  green: lower cost, stable growth, industrial/agricultural expansion, moderate upside
  orange: lowest land cost and highest extraction/hunting premiums, but persistent
    mortality and infrastructure risk
population_effect: Earth exports population pressure while importing refined value,
  strategic resources and successful frontier capital. Green worlds become the normal
  growth belt. Orange worlds become a mixture of hard-luck relocation, risk-seeking
  opportunity, military presence and resource booms.
source_transform_basis:
- Transformed source records describe Earth living as expensive enough to push people
  toward cheaper offworld shelters.
- Transformed source records describe unequal shelter safety and dangerous hunting
  economies.
- Game canon formalizes these pressures into a managed relocation system instead of
  leaving migration as an unexplained background fact.
