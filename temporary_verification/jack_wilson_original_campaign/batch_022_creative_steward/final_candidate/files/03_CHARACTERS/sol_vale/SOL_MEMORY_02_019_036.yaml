entries:
- id: SOL_MEM_019
  age: 12
  year_ce: 2665
  title: The impossible knock
  fidelity: CORE
  valence: fear
  privacy: private
  tags:
  - ability
  - manifestation
  - sound
  people: []
  memory: While staring at a sealed wall panel during an inspection, he hears a distinct double knock from it. Everyone else hears
    it too. His stomach drops before curiosity arrives.
- id: SOL_MEM_020
  age: 12
  year_ce: 2665
  title: Trying again
  fidelity: CORE
  valence: wonder
  privacy: private
  tags:
  - ability
  - training
  people: []
  memory: Under supervision he is told to reproduce the sound on three marked panels. The first two attempts fail. The third produces
    a faint tap exactly where he is looking.
- id: SOL_MEM_021
  age: 12
  year_ce: 2665
  title: Ability clinic waiting room
  fidelity: VIVID
  valence: relief
  privacy: private
  tags:
  - ability
  - clinic
  people: []
  memory: He spends forty minutes convinced the exam will reveal something dangerous. Instead, staff describe the ability as low-output
    acoustic projection. Being ordinary is a relief.
- id: SOL_MEM_022
  age: 12
  year_ce: 2665
  title: False alarm lecture
  fidelity: CORE
  valence: chastened
  privacy: private
  tags:
  - ability
  - law
  - safety
  people: []
  memory: A safety instructor asks how many people can die because of a harmless sound. Sol answers 'none' and is made to think
    through evacuation panic, ignored alarms and misdirected responders.
- id: SOL_MEM_023
  age: 12
  year_ce: 2665
  title: Knock code practice
  fidelity: PROCEDURAL
  valence: content
  privacy: private
  tags:
  - ability
  - habit
  people: []
  memory: 'He develops simple private rhythms on scrap panels: one tap for attention, two for uncertainty, three for ''check the
    other side.'' He never formalizes them as safety codes.'
- id: SOL_MEM_024
  age: 13
  year_ce: 2666
  title: Assessor prank
  fidelity: CORE
  valence: amused
  privacy: private
  tags:
  - ability
  - prank
  people: []
  memory: Sol projects a knock from the wrong door during an evaluation and watches the assessor check it. The success feels brilliant
    for four seconds.
- id: SOL_MEM_025
  age: 13
  year_ce: 2666
  title: Conduct warning
  fidelity: VIVID
  valence: resentful
  privacy: private
  tags:
  - ability
  - consequence
  people:
  - CHAR_IVEN_MARR
  memory: The disciplinary note uses the phrase 'misuse of attention-manipulating ability.' Sol thinks it is absurdly grand until
    Iven later explains conditioning against real alarms.
- id: SOL_MEM_026
  age: 13
  year_ce: 2666
  title: First orbit transfer
  fidelity: VIVID
  valence: wonder/fear
  privacy: private
  tags:
  - space
  - travel
  people:
  - CHAR_TOMAS_VALE
  memory: The transfer habitat rotates slowly enough that he can feel the gravity shift in his inner ear. He dislikes sleeping
    with vacuum on the other side of a wall.
- id: SOL_MEM_027
  age: 13
  year_ce: 2666
  title: Hull worker hands
  fidelity: VIVID
  valence: mixed
  privacy: private
  tags:
  - father
  - work
  people:
  - CHAR_TOMAS_VALE
  memory: Sol notices old sealant scars on Tomas's gloves and realizes his father works in places where mistakes are instantly
    lethal. Resentment and admiration become harder to separate.
- id: SOL_MEM_028
  age: 14
  year_ce: 2667
  title: Meeting Iven Marr
  fidelity: CORE
  valence: formative
  privacy: private
  tags:
  - mentor
  - evidence
  people:
  - CHAR_IVEN_MARR
  memory: Iven asks Sol what he knows. Sol gives a long answer. Iven asks what Sol can prove. The second answer is much shorter.
- id: SOL_MEM_029
  age: 14
  year_ce: 2667
  title: Route runner rain
  fidelity: ORDINARY
  valence: annoyed
  privacy: private
  tags:
  - work
  - route
  people: []
  memory: A wet shift carrying diagnostic modules between utility access points teaches Sol that maps flatten every miserable vertical
    stair into one clean line.
- id: SOL_MEM_030
  age: 14
  year_ce: 2667
  title: The lying green indicator
  fidelity: CORE
  valence: trauma
  privacy: private
  tags:
  - accident
  - safety
  people: []
  memory: The isolation indicator is green. Sol skips the physical verification because they are behind schedule. The line is not
    safe.
- id: SOL_MEM_031
  age: 14
  year_ce: 2667
  title: Scorched sealant
  fidelity: VIVID
  valence: trauma
  privacy: private
  tags:
  - accident
  - smell
  people: []
  memory: His strongest sensory fragment from the accident is the smell of overheated seal material and a coworker's involuntary
    shout. He still gets a flash of it near hot polymer.
- id: SOL_MEM_032
  age: 14
  year_ce: 2667
  title: Admission
  fidelity: CORE
  valence: shame
  privacy: private
  tags:
  - accountability
  people: []
  memory: Before anyone asks who skipped the check, Sol says he did. His voice shakes. He is surprised that confession feels cleaner
    than waiting.
- id: SOL_MEM_033
  age: 14
  year_ce: 2667
  title: Removed from live work
  fidelity: VIVID
  valence: shame
  privacy: private
  tags:
  - consequence
  people: []
  memory: For three weeks he is limited to inventory, classroom drills and observation. He interprets every kind look as pity and
    every neutral look as judgment.
- id: SOL_MEM_034
  age: 14
  year_ce: 2667
  title: Iven's rule
  fidelity: CORE
  valence: formative
  privacy: private
  tags:
  - mentor
  - trust
  people:
  - CHAR_IVEN_MARR
  memory: 'Iven tells him: ''You don''t earn trust by never failing. You earn it by making failure harder next time.'' Sol writes
    it inside the notebook cover.'
- id: SOL_MEM_035
  age: 14
  year_ce: 2667
  title: Requalification touch-check
  fidelity: CORE
  valence: pride
  privacy: private
  tags:
  - safety
  - recovery
  people: []
  memory: During requalification he physically touches each isolation point even when redundant. The evaluator asks why. Sol answers,
    'Because green isn't a physical state.'
- id: SOL_MEM_036
  age: 15
  year_ce: 2668
  title: Mara's shoulder injury
  fidelity: VIVID
  valence: worry
  privacy: private
  tags:
  - mother
  - injury
  people:
  - CHAR_MARA_VALE
  memory: He sees Mara trying to lift a service bag one-handed after her injury and realizes she is worse at accepting help than
    he is.
