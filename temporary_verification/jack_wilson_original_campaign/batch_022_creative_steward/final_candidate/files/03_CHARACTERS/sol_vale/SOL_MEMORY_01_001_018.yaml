entries:
- id: SOL_MEM_001
  age: 4
  year_ce: 2657
  title: Cold floor under the sink
  fidelity: CORE
  valence: warm
  privacy: private
  tags:
  - mother
  - maintenance
  - sound
  people:
  - CHAR_MARA_VALE
  memory: 'The first memory Sol trusts as genuinely his: bare knees on a cold composite floor while Mara replaces a regulator.
    He remembers a blue inspection light and the way her voice changed when the vibration became normal again.'
- id: SOL_MEM_002
  age: 4
  year_ce: 2657
  title: The warning sound lesson
  fidelity: CORE
  valence: warm
  privacy: private
  tags:
  - principle
  - maintenance
  people:
  - CHAR_MARA_VALE
  memory: Mara tells him that failures are rarely silent; people are usually too rushed, inexperienced or afraid to notice the
    warnings. The sentence becomes one of Sol's lifelong heuristics.
- id: SOL_MEM_003
  age: 5
  year_ce: 2658
  title: Tomas packing for orbit
  fidelity: VIVID
  valence: sad
  privacy: private
  tags:
  - father
  - separation
  people:
  - CHAR_TOMAS_VALE
  memory: Tomas folds work layers into a rigid transit bag and promises the contract will feel short. Sol is more interested in
    the vacuum-rated gloves than the goodbye until the door closes.
- id: SOL_MEM_004
  age: 5
  year_ce: 2658
  title: First orbital message
  fidelity: VIVID
  valence: wonder
  privacy: private
  tags:
  - space
  - father
  people:
  - CHAR_TOMAS_VALE
  memory: A delayed message from Tomas shows a maintenance crawlspace with the planet curved through a tiny port behind him. Sol
    replays the six-second view more than the actual message.
- id: SOL_MEM_005
  age: 6
  year_ce: 2659
  title: Black corridor
  fidelity: VIVID
  valence: fear
  privacy: private
  tags:
  - blackout
  - sound
  - community
  people: []
  memory: During the neighborhood blackout he recognizes people by breathing and shoe noise in the corridor. He learns that darkness
    makes ordinary neighbors sound like strangers for the first few seconds.
- id: SOL_MEM_006
  age: 6
  year_ce: 2659
  title: Emergency light returns
  fidelity: VIVID
  valence: relief
  privacy: private
  tags:
  - infrastructure
  - community
  people: []
  memory: The red emergency strips come back one segment at a time. Sol remembers the adults' shoulders dropping more clearly than
    the lights themselves.
- id: SOL_MEM_007
  age: 7
  year_ce: 2660
  title: Kessa's torque lesson
  fidelity: CORE
  valence: embarrassed
  privacy: private
  tags:
  - sister
  - tools
  - accountability
  people:
  - CHAR_KESSA_VALE
  memory: Kessa makes him loosen and retighten twelve practice fasteners after he strips one. She does not let him call the tool
    defective.
- id: SOL_MEM_008
  age: 7
  year_ce: 2660
  title: Shared roof vent
  fidelity: VIVID
  valence: wonder
  privacy: private
  tags:
  - sister
  - district
  people:
  - CHAR_KESSA_VALE
  memory: Kessa takes him to a permitted maintenance overlook where heat shimmer rises from the district exhaust towers. He decides
    infrastructure is more interesting from inside than from the public side.
- id: SOL_MEM_009
  age: 8
  year_ce: 2661
  title: Locker latch
  fidelity: CORE
  valence: pride
  privacy: private
  tags:
  - first repair
  - independence
  people: []
  memory: He fixes a communal locker latch with a discarded spring and shim. Nobody knows he did it until days later; he checks
    the latch every time he passes for a month.
- id: SOL_MEM_010
  age: 8
  year_ce: 2661
  title: Oran's analog gauge
  fidelity: VIVID
  valence: amused
  privacy: private
  tags:
  - mentor
  - analog
  - skepticism
  people:
  - CHAR_ORAN_PELL
  memory: Retired worker Oran Pell shows him an analog pressure gauge and says networks can lie in more sophisticated ways than
    needles. Sol likes the insolence of the sentence.
- id: SOL_MEM_011
  age: 9
  year_ce: 2662
  title: Condensate spray
  fidelity: VIVID
  valence: embarrassed
  privacy: private
  tags:
  - school
  - mistake
  people:
  - CHAR_LEVA_QUILL
  memory: He opens the wrong purge and is drenched in warm dirty condensate in front of six other students. The class laughter
    burns worse than the water.
- id: SOL_MEM_012
  age: 9
  year_ce: 2662
  title: Leva's correction
  fidelity: CORE
  valence: mixed
  privacy: private
  tags:
  - teacher
  - accountability
  people:
  - CHAR_LEVA_QUILL
  memory: Instructor Leva Quill makes him explain the valve path to the class instead of simply apologizing. He discovers that
    explaining his mistake reduces the shame.
- id: SOL_MEM_013
  age: 10
  year_ce: 2663
  title: Filter inventory
  fidelity: ORDINARY
  valence: neutral
  privacy: private
  tags:
  - work
  - inventory
  people: []
  memory: 'Youth civic rotation: three hours counting filter cartridges in a room that smells of dust and polymer. Sol learns that
    maintenance includes boring certainty, not only repairs.'
- id: SOL_MEM_014
  age: 10
  year_ce: 2663
  title: Lost part route
  fidelity: VIVID
  valence: guilt
  privacy: private
  tags:
  - work
  - logistics
  people: []
  memory: He mislabels one parts bin and causes a technician to walk two extra corridors. The technician does not yell; that makes
    Sol feel worse.
- id: SOL_MEM_015
  age: 10
  year_ce: 2663
  title: First fault notebook
  fidelity: CORE
  valence: warm
  privacy: private
  tags:
  - notebook
  - habit
  people:
  - CHAR_ORAN_PELL
  memory: He begins a cheap paper notebook because Oran says batteries fail at the most interesting times. The first page is mostly
    bad sketches.
- id: SOL_MEM_016
  age: 11
  year_ce: 2664
  title: Transit puzzle with Nia
  fidelity: VIVID
  valence: happy
  privacy: private
  tags:
  - friend
  - transit
  people:
  - CHAR_NIA_ROOK
  memory: Nia bets him she can reach a repair depot using fewer transfers. She wins because Sol optimizes distance and ignores
    queue time.
- id: SOL_MEM_017
  age: 11
  year_ce: 2664
  title: Mandatory assembly
  fidelity: ORDINARY
  valence: amused
  privacy: private
  tags:
  - friend
  - school
  people:
  - CHAR_NIA_ROOK
  memory: Sol and Nia communicate an entire critique of a motivational speaker using facial expressions. He nearly laughs at the
    wrong moment.
- id: SOL_MEM_018
  age: 11
  year_ce: 2664
  title: First serious argument with Mara
  fidelity: VIVID
  valence: angry
  privacy: private
  tags:
  - mother
  - autonomy
  people:
  - CHAR_MARA_VALE
  memory: Mara refuses to let him accompany a live-pressure call. Sol accuses her of treating him like a child; later he realizes
    he is, in fact, eleven.
