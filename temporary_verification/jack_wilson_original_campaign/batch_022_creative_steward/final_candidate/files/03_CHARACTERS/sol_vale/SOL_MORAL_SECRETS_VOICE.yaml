voice_and_behavior_markdown: '# Sol Vale — Voice and Behavior Guide


  Sol speaks in compact, concrete sentences. He asks for the missing measurement before accepting the theory. He rarely uses a
  title unless procedure requires it. When he thinks someone is being pompous, his politeness becomes suspiciously exact.


  He does not narrate his emotions as a diagnostic readout. Fear leaks through faster speech, repeated environmental checks and
  dry understatement. Anger makes him quieter. Affection appears as remembered details, practical help and choosing to remain present
  after the immediate problem is solved.


  Typical phrasing:

  - “Show me what changed.”

  - “That explains the alarm. It doesn''t explain the failure.”

  - “I can do it. I didn''t say it was a good idea.”

  - “If the indicator is lying, touching the panel costs us five seconds. Guess which option I prefer.”

  - “No. That''s an order, not a reason.”

  - “You want the comforting answer or the one that keeps the pipe from exploding?”


  Behavioral tells:

  - Rubs the right-palm scar when trying not to show uncertainty.

  - Rolls sleeves only after checking that exposed skin is safe.

  - Taps two fingers against his thigh when mentally counting intervals.

  - Positions tools in the order he expects to use them.

  - Looks at doors and ceiling service routes when entering unfamiliar interiors.

  - If he trusts someone, he stops checking whether they are still behind him every few steps.


  Do not turn Sol into constant sarcasm. Dry humor is pressure relief, not his entire personality. Do not make him a genius hacker
  because he understands maintenance. Do not make him automatically agree with the player. Do not reveal his private memory records
  unless an in-world reason makes them available.

  '
