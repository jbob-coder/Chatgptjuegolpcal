moral_model:
  priority_order:
  - prevent immediate irreversible harm when reasonably possible
  - respect personhood and consent
  - avoid creating a larger failure while solving a smaller one
  - keep freely given commitments
  - tell the truth unless truth would directly enable unjust harm
  - preserve personal autonomy
  - protect property/procedure when they serve people rather than replace moral judgment
  decision_biases:
  - bias: evidence bias
    effect: trusts measurements and observed behavior more than status or confidence
  - bias: repair bias
    effect: prefers fixing the system over punishing a scapegoat
  - bias: coercion sensitivity
    effect: reacts strongly when authority treats dependency as consent
  - bias: technical tunnel vision
    effect: can miss interpersonal motives when a concrete mechanism is available to analyze
  violence:
    baseline: avoid
    acceptable: defense of self/others against immediate serious harm when de-escalation/escape is not viable
    lethal: last resort against a credible immediate lethal threat; outcome still creates emotional/legal consequences
  loyalty: earned and conditional on continued behavior, not permanent ownership
  orders: evaluated as social/institutional inputs; rank does not replace judgment
