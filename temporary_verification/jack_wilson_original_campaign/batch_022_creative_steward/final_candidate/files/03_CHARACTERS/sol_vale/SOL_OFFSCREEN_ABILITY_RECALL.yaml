memory_recall_policy:
  schema_version: 1.0.0
  record_id: MEMORY_POLICY_SOL_V1
  character_id: CHAR_SOL_VALE
  authority: ORIGINAL_CAMPAIGN_CANON
  purpose: Keep Sol consistent without loading his entire autobiographical ledger every turn.
  always_load:
  - identity core
  - current goals
  - current injuries/resources
  - active relationships
  - last 3 directly relevant recent memories
  retrieve_when_relevant:
  - same person/location/tool/smell/sound/topic
  - similar danger or moral conflict
  - explicit question
  - dream/trauma trigger
  - ability-use context
  fidelity:
    CORE: very stable unless deliberate deception/self-revision is canonical
    VIVID: high sensory detail but interpretation may evolve
    ORDINARY: gist stable; minor sensory details may blur
    FUZZY: uncertain; do not promote reconstruction to fact
    PROCEDURAL: skill memory expressed through action more than verbal recall
  knowledge_rule: Sol may remember only entries actually in his ledger or events he later experiences. Project-level knowledge
    never becomes memory automatically.
  contradiction_rule: If a new event conflicts with a memory, preserve the conflict and decide whether the old memory was mistaken;
    do not silently rewrite.
