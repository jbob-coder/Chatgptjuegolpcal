    event: assessor prank
    lesson: misdirection has safety consequences even when the effect itself cannot injure
  - age: 14
    event: work-code practice
    lesson: uses distinct knock patterns to practice precision and timing; does not use them as official safety signals
  - age: 15
    event: unauthorized guard diversion
    lesson: ability works best when it reinforces a listener's existing expectation; guilt increased caution
  - age: 16
    event: maintenance diagnostic experiment
    lesson: a false knock cannot reveal hidden structure by itself, but can help compare human attention/echo response when used
      carefully
