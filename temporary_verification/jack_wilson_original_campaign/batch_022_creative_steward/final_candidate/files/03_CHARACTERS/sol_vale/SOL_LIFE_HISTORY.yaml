events:
- year_ce: 2653
  age: 0
  title: Birth and home
  detail: Born into a working civilian household in Asterline Service Ward 07, a dense utility-and-transit support district
    outside the currently READY start slice. Exact civil month/day is left unspecified because the campaign's absolute calendar
    is not yet fixed.
- year_ce: 2657
  age: 4
  title: First machine memory
  detail: 'Earliest durable memory: sitting under a service sink while his mother Mara replaced a pressure regulator. He remembers
    the cold floor, the metallic smell and her telling him that machines usually warn you before they fail if you learn what
    normal sounds like.'
- year_ce: 2658
  age: 5
  title: Father's first long orbital contract
  detail: Tomas Vale accepts an orbital salvage-maintenance rotation. Sol learns that a person can love you and still choose
    work that takes them away for months.
- year_ce: 2659
  age: 6
  title: Neighborhood blackout
  detail: A cascade fault darkens three residential stacks. Sol spends part of the outage identifying neighbors by voice in
    the corridor and becomes permanently sensitive to the emotional difference between ordinary darkness and failed infrastructure.
- year_ce: 2660
  age: 7
  title: Kessa teaches him tools
  detail: 'Older sister Kessa teaches him to use a torque driver and makes him redo every fastener he overtightens. He learns
    the rule: if a tool makes a bad decision easy, slow down.'
- year_ce: 2661
  age: 8
  title: First unsupervised repair
  detail: Repairs a broken latch on a communal storage locker using a shim and a discarded spring. The success produces an
    outsized sense of independence.
- year_ce: 2662
  age: 9
  title: Pressure-line mistake
  detail: Opens the wrong low-pressure purge during a supervised lesson, spraying dirty condensate across himself and the
    instructor. Harmless, humiliating, memorable.
- year_ce: 2663
  age: 10
  title: Community repair rotation
  detail: 'Begins youth civic-maintenance hours: inventorying filters, cleaning sensor housings, carrying parts and learning
    route discipline.'
- year_ce: 2664
  age: 11
  title: Friendship with Nia Rook
  detail: Bonds with Nia over transit-route puzzles and a shared dislike of mandatory motivational assemblies.
- year_ce: 2665
  age: 12
  title: Ability manifestation
  detail: During a tense maintenance inspection, a knock sounds from a sealed wall panel Sol is staring at even though nobody
    touched it. Repetition under supervision confirms a small acoustic projection ability later cataloged as False Knock.
- year_ce: 2665
  age: 12
  title: Ability safety instruction
  detail: Learns that a harmless sound can still create dangerous behavior if people believe it signals fire, pressure failure,
    an intruder or a supervisor. This shapes his caution with deception.
- year_ce: 2666
  age: 13
  title: Bad prank and consequence
  detail: Uses False Knock to make an assessor check the wrong door during a youth evaluation. No one is harmed, but Sol receives
    a formal conduct warning and extra safety training. He resents the punishment until his mentor explains how false alarms
    train people to ignore real ones.
- year_ce: 2666
  age: 13
  title: First orbital visit
  detail: Visits a low-orbit transfer facility during a family trip connected to Tomas's contract. Sol loves the engineering
    and hates the sense that one pressure hull separates ordinary conversation from lethal vacuum.
- year_ce: 2667
  age: 14
  title: Apprenticeship begins
  detail: Assigned to supervised civic maintenance under Iven Marr. Starts route-running between utility nodes and keeping
    a handwritten fault notebook.
- year_ce: 2667
  age: 14
  title: Isolation shortcut accident
  detail: Skips a redundant isolation check; an indicator lies. A coworker receives a painful heat/pressure burn. Sol reports
    his own shortcut and is temporarily removed from live-system work.
- year_ce: 2667
  age: 14
  title: Requalification
  detail: Completes additional procedure training and returns to duty with a reputation for being slower but safer. Starts
    touching each isolation point physically when possible.
- year_ce: 2668
  age: 15
  title: Mother injured
  detail: Mara suffers a non-life-threatening shoulder injury during a maintenance collapse and cannot work full shifts for
    several months. Sol takes more household errands and learns how thin a working family's scheduling margin can be.
- year_ce: 2668
  age: 15
  title: Unauthorized retrieval
  detail: Helps Nia recover a confiscated personal diagnostic tool from a locked training office by using False Knock to divert
    a guard's attention. Sol still considers the confiscation unfair and his method dishonest; he has never told Mara.
- year_ce: 2669
  age: 16
  title: Flooded corridor incident
  detail: During a combined leak/electrical fault, helps isolate a live branch and assists three residents out of a threatened
    corridor. This becomes his strongest private evidence that fear does not automatically mean cowardice.
- year_ce: 2669
  age: 16
  title: Certification setback
  detail: Fails the first attempt at an advanced instrumentation certification because he overcomplicates the fault tree and
    misses a simple physical connector failure.
- year_ce: 2670
  age: 17
  title: Certification pass
  detail: Passes on the second attempt after Iven forces him to begin every diagnostic with 'what can I prove physically right
    now?'
- year_ce: 2670
  age: 17
  title: Current baseline
  detail: Works as a civilian maintenance apprentice and route-runner. He is competent with ordinary 2670 infrastructure,
    not an elite hacker or engineer. He has not met Jack Wilson and is outside the current READY start district.
continuity_rule: These events are established pre-game memory/canon and may not be retroactively contradicted for convenience
  without a recorded supersession.
