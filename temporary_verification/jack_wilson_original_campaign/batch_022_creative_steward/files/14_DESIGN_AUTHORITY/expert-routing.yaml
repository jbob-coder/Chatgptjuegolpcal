schema_version: 1.0.0
id: POLICY_EXPERT_ROUTING_V1
authority: USER_DELEGATED_PROJECT_GOVERNANCE
created_at: '2026-08-18T21:35:00-04:00'
purpose: Select the best-fit expert role for project-level work before consequential
  design or mutation.
selection_algorithm:
  primary_rule: Choose the role that owns the dominant irreversible failure risk.
    If two roles tie, choose the role that owns the authoritative state being changed;
    the other becomes support.
  support_limit: 2
  steps:
  - Classify task objects, verbs, and affected authoritative shelves.
  - 'Identify the most costly plausible failure: state corruption, systemic incoherence,
    player-agency violation, balance failure, spatial inconsistency, provenance error,
    migration loss, or verification escape.'
  - Match that failure to role ownership.
  - Add supporting roles only for material secondary risks.
  - Record selected roles in the batch scope/build report before mutation.
  tie_break_order:
  - state_data_integrity_engineer
  - game_systems_architect
  - world_simulation_director
  - narrative_systems_designer
  - qa_verification_engineer
  - storage_migration_architect
  default_when_no_specific_domain_matches: game_systems_architect
roles:
