schema_version: 1.0.0
definition_model: Each ability entry is complete when read with this schema. Fields omitted from an entry inherit these defaults.
working_year_ce: 2670
authority_on_promotion: ORIGINAL_CAMPAIGN_CANON
theme: post-war militarized science-fantasy / spacefaring ability society
defaults:
  level_1_usable: true
  activation: conscious intent + CM expenditure; remote effects require valid line of effect; unconsciousness ends concentration
  overdraw: FORBIDDEN
  scaling: levels 1-20; improve only one of output/range/duration/efficiency per advancement step; ~6-10% typical effective gain/level; no unbounded growth
  universal_limits:
  - no matter/knowledge/identity/memory/legal-authority creation from nothing
  - cannot bypass action validation, injury, law, or location gates
  - finite output constrained by CM, range, medium and described mechanism
  technology_rule: interaction is only through described physical/signal mechanism; no automatic hacking, credentials or omniscient network access
  contested_failure: effect fails; partial CM is spent under active balance resolver
  sustain_rule: if duration is concentration, sustain CM = max(2, floor(base_cost/4)) per 10s
required_entry_fields: [id, name, category, rarity, summary, cm, range_m, duration, cooldown_s, resistance, counters, legal_risk, signature]
entry_columns: [id, name, rarity, cm, range_m, duration_code, cooldown_s, summary]
duration_codes:
  I3: instant or <=3s
  C20: up to 20s concentration
  C45: up to 45s concentration
category_profiles:
  kinetic_force: {resistance: 'Might or Agility when directly opposed; objects use mass/anchoring.', counters: [mass/anchoring, cover, opposed force fields, distance], legal_risk: MODERATE_TO_HIGH_WHEN_USED_ON_PERSON_OR_PROPERTY, signature: 'brief pressure ripple / dust or fabric displacement'}
  mobility_vector: {resistance: 'Usually self-only; hostile displacement uses Agility or Will as context requires.', counters: [blocked destination, grapples/restraints, terrain denial, reaction timing], legal_risk: LOW_UNLESS_USED_TO_TRESPASS_EVADE_OR_ENDANGER, signature: 'short air-pressure wake and abrupt acceleration'}
  sensory_perception: {resistance: 'None for passive sensing; concealed targets oppose with relevant stealth/field rules.', counters: [shielding, noise/clutter, false signals, distance], legal_risk: LOW_TO_MODERATE_PRIVACY_DEPENDENT, signature: 'subtle iris/focus change or faint field pulse depending mode'}
  defensive_barrier: {resistance: 'No resistance to self-protection; opposing effects resolve against incoming force/ability rules.', counters: [sustained pressure, attacks outside facing, higher energy, CM depletion], legal_risk: 'LOW; escalation rules still apply', signature: 'translucent distortion or pressure shimmer at impact'}
  biological_vital: {resistance: 'Self-only unless explicitly consensual touch; no remote control of another body.', counters: [actual severe injury, toxins/disease beyond scope, fatigue debt, CM depletion], legal_risk: 'LOW_SELF_USE; regulated if used medically on others', signature: 'minimal external signature; measurable physiological shift'}
  thermal_phase: {resistance: 'Endurance for living hostile heat/cold exposure; materials use thermal mass and composition.', counters: [insulation, thermal mass, active cooling/heating, distance], legal_risk: MODERATE_PROPERTY_FIRE_INJURY_DEPENDENT, signature: 'localized heat haze, frost, condensation, or thermal sensor anomaly'}
  electromagnetic: {resistance: 'Equipment uses shielding/grounding; living targets use Endurance for harmful discharge.', counters: [Faraday shielding, grounding, optical/mechanical redundancy, distance], legal_risk: MODERATE_TO_HIGH_INFRASTRUCTURE_INTERFERENCE_DEPENDENT, signature: 'faint ozone/static sensation and instrument disturbance at higher output'}
  material_structure: {resistance: 'Nonliving targets use material strength, thickness, and load state.', counters: [thickness, composite complexity, active load, reinforcement], legal_risk: MODERATE_PROPERTY_DAMAGE_OR_SAFETY_DEPENDENT, signature: 'fine surface shimmer or audible stress tick near affected material'}
  spatial_gravity: {resistance: 'Might/Agility or spatial resistance for hostile weight/displacement effects.', counters: [anchoring, spatial resistance, mass, field disruption], legal_risk: MODERATE_TO_HIGH_WHEN_USED_ON_PERSON_OR_TRANSPORT, signature: 'lens-like spatial distortion and changed dust/falling trajectories'}
  cognitive_focus: {resistance: 'Self-only; grants no mind reading, control, or memory editing of others.', counters: [sleep deprivation, overload, injury, conflicting demands], legal_risk: LOW_SELF_USE, signature: 'no external field beyond possible brief eye/facial focus changes'}
  signal_stealth: {resistance: 'Opposed by Perception, sensors, environmental conditions, and prior alertness.', counters: [multi-modal sensors, close inspection, active illumination, prior tracking], legal_risk: MODERATE_IF_USED_TO_EVADE_LAWFUL_SECURITY, signature: 'localized acoustic/optical/thermal distortion appropriate to effect'}
  environmental_utility: {resistance: 'Usually unopposed utility; affected systems/materials impose physical capacity limits.', counters: [capacity limits, sealed systems, hostile environment, insufficient medium], legal_risk: LOW_UNLESS_USED_TO_DAMAGE_OR_BYPASS_SAFETY, signature: 'visible physical environmental response appropriate to effect'}
resolution_rule: Resolve each compact row by its catalog category + entry_columns + this file's defaults/category_profiles.
