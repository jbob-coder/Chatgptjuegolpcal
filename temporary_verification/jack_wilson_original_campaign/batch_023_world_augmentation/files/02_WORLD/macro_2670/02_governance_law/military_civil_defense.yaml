schema_version: 1.0.0
defense_id: DEFENSE_READINESS_2670_V1
authority: ORIGINAL_CAMPAIGN_CANON
strategic_context: Human settlements remain security-conscious after earlier interregional and offworld conflicts;
  defense institutions are normalized but civilian government remains distinct.
civic_defense_term:
  name: Civic Defense Readiness Term
  status: compulsory for qualifying cohorts unless exempt/deferred
  typical_length_months: 18
  components:
  - physical readiness
  - emergency response
  - basic weapons safety
  - ability hazard control
  - field logistics
  - civil-defense law
  - specialization testing
  exemptions:
  - medical incapacity
  - caregiver hardship
  - specialized essential-service deferment subject to review
  appeal: administrative appeal with medical/household evidence
academy:
  id: ACADEMY_RAVELIN_01
  name: Ravelin Defense Academy
  role: regional intake/training campus
  capacity_trainees: 6200
  security: controlled perimeter with civilian visitor zones
  curriculum_model: cohort basic phase followed by specialization tracks
  t0_transport: ROUTE_START_TO_RAVELIN_ACADEMY
civil_military_boundary: Military personnel do not have ordinary policing authority over civilians outside defined
  defense property/emergencies.
ability_policy: Abilities are assessed for safety and specialization but do not guarantee rank or privileged status.
