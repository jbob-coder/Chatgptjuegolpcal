schema_version: 1.0.0
law_id: LAWSET_ASTERLINE_CIVIL_2670_V1
authority: ORIGINAL_CAMPAIGN_CANON
jurisdiction: JURISDICTION_PREACADEMY_CIVIL_01
age_thresholds:
  civil_majority: 18
  independent_work_credential_min: 16
  defense_readiness_eligibility: late secondary-school cohort; exact individual intake governed by notice
offense_tiers:
  T0:
    label: administrative/low harm
    typical_outcomes:
    - warning
    - restorative action
    - small in-game credit assessment
    - temporary access restriction
  T1:
    label: minor criminal/civil harm
    typical_outcomes:
    - restitution
    - probationary supervision
    - service hours
    - temporary ability-use restriction
  T2:
    label: serious harm/risk
    typical_outcomes:
    - custodial sentence possible
    - longer ability/device restriction
    - victim restitution
    - mandatory safety review
  T3:
    label: grave violent or infrastructure offense
    typical_outcomes:
    - extended custody
    - high-security supervision
    - loss of specific credentials
    - specialist court review
ability_rules:
- rule: Non-consensual direct manipulation of another person's body, mind, stats, ability state or protected credentials
    is treated at least as assault/interference and may escalate by harm.
- rule: Creating deceptive signals in safety-critical environments is prohibited when a reasonable person could
    cause danger by reacting.
- rule: Benign ability practice is legal in ordinary public space unless it creates hazards, trespass, harassment,
    fraud or restricted-system interference.
- rule: Ability registration records hazardous characteristics and emergency countermeasures; mere ability possession
    is not a crime.
property_and_privacy:
- unauthorized taking is theft regardless of whether accomplished physically or by ability
- private habitation requires consent/warrant/emergency justification
- personal communicators and medical records require lawful access
evidence:
- sensor evidence has provenance requirements
- ability-generated evidence is not self-authenticating
- automated accusation cannot alone establish guilt
- defendants can challenge model/sensor reliability
public_safety: Local Public Safety Service handles ordinary response; armed escalation requires documented threat
  justification.
penalty_currency: All fines/assessments are fictional campaign credits only.
supersession: This original-canon lawset supersedes the previous temporary generic filler for operational play;
  historical copies remain audit evidence.
