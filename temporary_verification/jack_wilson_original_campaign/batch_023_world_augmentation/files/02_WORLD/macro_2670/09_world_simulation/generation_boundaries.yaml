schema_version: 1.0.0
generation_id: GEN_BOUNDARIES_WORLD_2670_V1
authority: ORIGINAL_CAMPAIGN_CANON
instantiate_before_direct_use:
- interior geometry
- specific NPC private biography
- shop SKU stock
- building access/security state
- route segment hazards
- weather at exact future time
- specific legal warrant/case
- medical diagnosis
- combat encounter
may_be_macro_only_until_needed:
- distant cities
- far-off factions
- ordinary households not contacted
- regional supply depots
- offworld habitats
- noncritical streets
generation_inputs:
- macro module facts
- stable IDs
- current date/time
- adjacent geometry
- population/economy constraints
- existing relationships/events
- user canon
generation_outputs_required:
- stable ID
- authority/provenance
- dimensions/location if spatial
- dependencies
- state
- validation
- rollback/supersession note
knowledge_firewall: Generated truth does not automatically become character knowledge. Each character must learn
  it through valid perception, communication or prior memory.
source_firewall: Do not open/read paused raw novel chapters/endings to fill operational gaps unless the user later
  explicitly reactivates source reconstruction.
