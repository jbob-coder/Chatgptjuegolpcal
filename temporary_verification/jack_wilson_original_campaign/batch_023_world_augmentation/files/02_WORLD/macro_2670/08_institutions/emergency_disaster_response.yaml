schema_version: 1.0.0
emergency_id: EMERGENCY_RESPONSE_ASTERLINE_V1
authority: ORIGINAL_CAMPAIGN_CANON
incident_levels:
  L0: single-person/property incident handled locally
  L1: building/block incident; dispatch + utility/medical as needed
  L2: district incident; multi-service command and transit controls
  L3: metro emergency; emergency powers, shelters, regional aid
  L4: regional catastrophe; Terran Compact mutual-aid request
services:
- Public Safety
- Fire/Rescue
- Medical Response
- Utility Isolation
- Transit Control
- Civil Defense
- Shelter & Logistics
command: incident command is role-based; specialist utility/medical authority controls technical hazards within
  scope
ability_incidents: responders assess mechanism and hazard rather than assuming hostile ability use
civilian_duties: follow evacuation/isolation orders during declared hazard; unreasonable or unlawful orders remain
  reviewable afterward
stockpiles: distributed 72-hour local stocks plus regional reserves for water, food, medicine, batteries and shelter
  materials
