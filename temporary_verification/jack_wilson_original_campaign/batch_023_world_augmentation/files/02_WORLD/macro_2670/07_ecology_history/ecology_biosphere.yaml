schema_version: 1.0.0
ecology_id: ECOLOGY_EARTH_2670_V1
authority: ORIGINAL_CAMPAIGN_CANON
global_state: Recovered but heavily managed postwar biosphere; many habitats are restored corridors rather than
  untouched wilderness.
asterline:
  urban_wildlife:
  - pigeons/doves
  - crows
  - gulls
  - small passerines
  - rats/mice
  - squirrels
  - rabbits
  - raccoon-like mesocarnivores
  - insects
  - managed pollinators
  large_wildlife: rare in dense metro; deer-sized herbivores occur in outer greenbelts
  feral_animals: controlled but not eliminated
  green_infrastructure:
  - street trees
  - bioswales
  - roof gardens
  - storm ponds
  - coastal reed restoration
  - pollinator corridors
agriculture: vertical farms and controlled-environment agriculture reduce land pressure but do not replace field
  crops, orchards, fisheries or livestock entirely.
extinctions_and_restoration: Some species are extinct; others are preserved through managed breeding/genetic restoration.
  Restoration is expensive and politically contested.
hazards:
- invasive species
- storm-driven contamination
- heat stress
- crop pathogen outbreaks
- ecosystem failures when maintenance funding drops
creature_rule: Ordinary ecology and extraordinary game creatures are separate classes; do not invent a monster encounter
  merely because a biome exists.
