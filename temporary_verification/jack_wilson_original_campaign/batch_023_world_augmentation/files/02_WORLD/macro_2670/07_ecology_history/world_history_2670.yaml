note: This is original campaign history created to make the world operational. It is not a reconstruction of the
  paused source novel.
eras:
- years: 21st-23rd centuries
  name: Acceleration and Fragmentation
  events:
  - climate adaptation
  - AI/automation growth
  - orbital industry expansion
  - regional political fragmentation
  - early ability-era institutions emerge
- years: 2310-2395
  name: Consolidation Wars
  events:
  - resource and governance conflicts escalate
  - orbital infrastructure becomes strategic
  - several major cities and grids are damaged
  - civil-defense systems become normalized
- years: 2396-2460
  name: Reconstruction Compacts
  events:
  - interregional ceasefires
  - Terran Civic Compact foundations
  - mass infrastructure rebuilding
  - standard credit/payment interoperability grows
- years: 2461-2580
  name: Orbital Civil Expansion
  events:
  - permanent orbital population scales
  - lunar industry matures
  - portal prototypes become strategic infrastructure
  - ability law standardizes
- years: 2581-2650
  name: Managed Stability
  events:
  - major unions stabilize
  - city cooperatives expand
  - defense-readiness terms remain due to persistent security concerns
  - ecological restoration accelerates
- years: 2651-2670
  name: Uneasy Normalcy
  events:
  - high technology becomes mundane
  - local infrastructure and class differences persist
  - military/defense institutions remain influential
  - younger generation treats old-war caution as both normal and burdensome
current_tensions:
- civil autonomy vs defense obligations
- open information vs infrastructure security
- ability civil rights vs hazard regulation
- wealth/access disparities between Earth, orbital and frontier communities
- maintenance funding vs expansion projects
source_history_status: PAUSED_SEPARATE_TRACK
