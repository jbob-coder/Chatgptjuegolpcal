schema_version: 1.0.0
ability_society_id: ABILITY_SOCIETY_2670_V1
authority: ORIGINAL_CAMPAIGN_CANON
prevalence: Abilities are socially normal enough to have law, training, insurance and countermeasures, but exact
  population prevalence varies by region and cohort.
categories:
- kinetic
- sensory
- biological
- thermal/phase
- electromagnetic
- material
- spatial/gravity
- cognitive/focus
- signal/stealth
- environmental/utility
institutions:
- school safety programs
- civilian ability clinics
- hazard certification offices
- insurance risk assessors
- specialist law enforcement
- defense specialization programs
- professional ability leagues
civil_rights: Ability status is protected civil information in many contexts; discrimination is unlawful, but objective
  hazard licensing is permitted.
countermeasures: Good security combines physical design, sensors, procedures and trained staff rather than relying
  on one universal anti-ability device.
economic_effect: Useful abilities can raise earning potential but do not erase training, licensing or labor markets.
jack_steal: Jack's Steal remains governed by its dedicated canon/balance files and the general law against non-consensual
  interference.
sol_false_knock: Sol's False Knock is a low-output signal/stealth ability with ordinary legal and sensor counterplay.
