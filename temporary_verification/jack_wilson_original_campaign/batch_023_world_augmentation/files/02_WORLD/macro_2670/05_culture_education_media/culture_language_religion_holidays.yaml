schema_version: 1.0.0
culture_id: CULTURE_ASTERLINE_2670_V1
authority: ORIGINAL_CAMPAIGN_CANON
language:
  public_operational: Common English-descended Interlingua is dominant in Asterline public systems
  multilingualism: households preserve many heritage languages; public kiosks provide live translation for common
    registered languages
  translation_limit: idiom, private slang and low-resource languages can still be mistranslated
religion_worldview: Pluralistic. Organized religions, secular philosophies, ancestor traditions and new postwar
  movements coexist; government has no official faith.
holidays:
- name: Reconstruction Day
  date: 05-22
  meaning: civil remembrance of infrastructure restoration after the Consolidation Wars
  tone: public service + memorial
- name: Quiet Night
  date: 11-03
  meaning: remembrance of civilian dead; many districts dim nonessential exterior lighting for one hour
- name: Founders' Week
  date: 02-10 through 02-16
  meaning: local cooperative/municipal history; school and civic events
- name: Orbital Accord Day
  date: 07-18
  meaning: commemorates permanent civilian orbital governance standards
social_norms:
- asking before touching another person's wearable or ability-sensing equipment
- maintenance workers receive practical respect but not high social status
- public safety drills are routine
- ability bragging is common among adolescents and considered immature by many adults
food_music_art: Culturally mixed and highly regional; retro physical instruments, immersive media and handmade crafts
  coexist with generated content.
privacy_norm: people generally expect public-space sensor coverage but consider private-room and medical monitoring
  sensitive.
