schema_version: 1.0.0
ledger_id: LEDGER_WORLD_INSTANTIATION_BACKLOG_V1
authority: AUDIT
purpose: Track local detail that is intentionally not pre-instantiated even though the macro world is operationally
  defined.
not_structural_blockers:
- id: INSTANTIATE_ACADEMY_RAVELIN_CAMPUS
  priority: HIGH
  state: QUEUED
  trigger: before Jack can enter academy-controlled campus space
  required:
  - campus map
  - entry/security nodes
  - dorm/administration/training baseline
  - route validation
  - population/schedule seed
- id: INSTANTIATE_ASTERLINE_METRO_MAP
  priority: HIGH
  state: QUEUED
  trigger: before travel beyond immediate district requires exact street graph
  required:
  - metro districts
  - major transit trunks
  - medical/service hubs
  - freight corridors
  - ward adjacency
- id: INSTANTIATE_SOL_WARD_07
  priority: MEDIUM
  state: QUEUED
  trigger: before Sol's home/work area becomes directly enterable
  required:
  - residence exterior/interior boundaries
  - workshop route
  - supporting-cast locations
  - schedules
- id: INSTANTIATE_REGIONAL_MEDICAL_CENTER
  priority: MEDIUM
  state: QUEUED
  trigger: before referral/visit
  required:
  - entry
  - triage
  - treatment zones
  - security
  - staff baseline
- id: INSTANTIATE_ASTERLINE_CENTRAL_HUB
  priority: MEDIUM
  state: QUEUED
  trigger: before direct visit
  required:
  - station concourse
  - platforms
  - commercial/service nodes
  - security
- id: INSTANTIATE_ORBITAL_LINK_TERMINAL
  priority: LOW
  state: QUEUED
  trigger: before direct offworld travel
  required:
  - terminal
  - credential gates
  - transfer vehicle
  - schedule
  - costs
- id: EXPAND_DISTANT_POLITIES
  priority: LOW
  state: ON_DEMAND
  trigger: only when travel/news/politics makes exact internal detail relevant
  required:
  - regional subdivisions
  - leadership current state
  - trade/security relations
- id: GENERATE_PRIVATE_NPC_BIOGRAPHIES
  priority: ON_DEMAND
  state: ON_DEMAND
  trigger: when a specific generated NPC becomes socially relevant
  required:
  - history
  - knowledge
  - relationships
  - goals
  - schedule
  - provenance
- id: GENERATE_DYNAMIC_WEATHER
  priority: ON_DEMAND
  state: ON_DEMAND
  trigger: when future exact weather matters
  required:
  - date/time
  - climate model
  - recent state
  - auditable random/causal event
- id: GENERATE_DYNAMIC_MARKET_STOCK
  priority: ON_DEMAND
  state: ON_DEMAND
  trigger: when shop inventory changes or a new shop is visited
  required:
  - supply chain
  - budget
  - delivery state
  - current purchases
excluded_from_backlog:
- paused raw-source reconstruction
- source-neighbor private/future information
- Jack's private pregame school biography unless the user establishes it
rule: A queued local instantiation is not an operational world-record gap. It becomes a blocker only when a player
  action needs direct access and the pre-narration gate has not yet produced it.
updated_at: '2026-08-19T01:05:00-04:00'
